<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Robot632 // Signal Sequence</title>
<meta name="description" content="Robot632 Signal Sequence - a small memory game.">
<meta name="referrer" content="strict-origin-when-cross-origin">
<script>
  (function(){
    var saved = localStorage.getItem('robot632_theme');
    var preferred = saved || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
    document.documentElement.dataset.theme = preferred;
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800&family=Space+Mono:wght@400;700&family=Caveat:wght@700&family=Bangers&family=Permanent+Marker&family=Kalam:wght@700&family=Chewy&family=Rubik:wght@700&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='8' r='8' fill='%23e4e7eb'/><rect x='46' y='6' width='8' height='20' fill='%23e4e7eb'/><rect x='8' y='22' width='84' height='78' rx='15' fill='%23e4e7eb'/><rect x='20' y='46' width='60' height='28' rx='9' fill='%232c2f34'/><circle cx='38' cy='60' r='6.5' fill='%23e4e7eb'/><circle cx='62' cy='60' r='6.5' fill='%23e4e7eb'/></svg>">
<style>
  :root{
    --bg: #3f7288;
    --bg-deep: #234a5c;
    --text: #ffffff;
    --text-shadow: rgba(0,0,0,0.18);
    --panel-metal-hi: #eef2f5;
    --panel-metal-mid: #b7c3cd;
    --panel-metal-lo: #7e8d99;
    --panel-border: rgba(20,30,38,0.35);
    --tagline-bg: rgba(0,0,0,0.16);
    --tagline-border: rgba(255,255,255,0.18);
    --grid-line: rgba(255,255,255,0.06);
    --screen-bg-1: #16323e;
    --screen-bg-2: #0a1c24;
    --screen-line: rgba(180,205,215,0.35);
    --accent-cyan: #4be9ff;
    --accent-red: #ff4a3d;
    --pip-off: #4d6a8d;
    --vent-ring: #d7dee2;
  }
  html[data-theme="light"]{
    --bg: #cfe8ee;
    --bg-deep: #f2f8fa;
    --text: #0c2b33;
    --text-shadow: rgba(0,0,0,0.08);
    --tagline-bg: rgba(255,255,255,0.6);
    --tagline-border: rgba(0,60,70,0.15);
    --grid-line: rgba(0,60,70,0.08);
  }

  *{ box-sizing:border-box; }

  body{
    margin:0;
    height:100vh;
    height:100dvh;
    width:100vw;
    overflow:hidden;
    background: radial-gradient(circle at 50% -10%, var(--bg-deep), var(--bg) 60%);
    color: var(--text);
    font-family:'Nunito', sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:14px;
  }
  body::before{
    content:'';
    position:fixed;
    inset:0;
    pointer-events:none;
    background-image:
      linear-gradient(var(--grid-line) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
    background-size:34px 34px;
  }

  .panel{
    position:relative;
    width:100%;
    max-width:460px;
    height:100%;
    max-height:720px;
    background: var(--tagline-bg);
    border:2px solid var(--tagline-border);
    border-radius:24px;
    padding: clamp(20px,4.5vh,30px) clamp(18px,6vw,28px);
    display:flex;
    flex-direction:column;
    align-items:center;
    gap: clamp(10px,2vh,14px);
    overflow:hidden;
    box-shadow:0 30px 60px rgba(0,0,0,0.25);
  }

  .home-link{
    position:absolute;
    top:14px;
    right:16px;
    color: var(--text);
    opacity:0.75;
    text-decoration:none;
    font-family:'Space Mono', monospace;
    font-size:11px;
    letter-spacing:0.08em;
    border:1px solid var(--tagline-border);
    border-radius:6px;
    padding:4px 9px;
    text-transform:uppercase;
    transition: opacity 0.15s ease;
    z-index:3;
  }
  .home-link:hover{ opacity:1; }

  /* sound toggle -- same bordered-chip look as the home link, mirrored
     to the top-left corner. Icon swaps like the theme toggle does. */
  .sound-toggle{
    position:absolute;
    top:14px;
    left:16px;
    display:flex;
    align-items:center;
    justify-content:center;
    width:26px;
    height:26px;
    color: var(--text);
    opacity:0.75;
    background:none;
    border:1px solid var(--tagline-border);
    border-radius:6px;
    cursor:pointer;
    transition: opacity 0.15s ease;
    z-index:3;
  }
  .sound-toggle:hover{ opacity:1; }
  .sound-toggle svg{ width:14px; height:14px; }

  /* ---------- device: the panel WALL-E holds up to ---------- */
  .device{
    position:relative;
    width:100%;
    max-width:340px; /* lowered by fitDevice() on short screens */
    background: linear-gradient(155deg, var(--panel-metal-hi) 0%, var(--panel-metal-mid) 55%, var(--panel-metal-lo) 100%);
    border-radius:18px;
    border:1px solid var(--panel-border);
    padding:12px;
    display:flex;
    flex-direction:column;
    gap:10px;
    box-shadow:
      inset 0 2px 3px rgba(255,255,255,0.7),
      inset 0 -10px 16px rgba(0,0,0,0.15),
      0 14px 26px rgba(0,0,0,0.3);
    flex-shrink:0;
  }

  .screen{
    position:relative;
    width:100%;
    aspect-ratio: 5.4 / 2;
    border-radius:10px;
    background:
      repeating-linear-gradient(180deg, rgba(255,255,255,0.03) 0 2px, transparent 2px 6px),
      linear-gradient(160deg, var(--screen-bg-1), var(--screen-bg-2));
    border:1px solid rgba(0,0,0,0.4);
    box-shadow: inset 0 3px 8px rgba(0,0,0,0.6);
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .screen svg{ width:78%; height:78%; overflow:visible; }
  .screen{ transition: background 0.25s ease, box-shadow 0.25s ease; }
  .screen.victory{
    background:
      repeating-linear-gradient(180deg, rgba(255,255,255,0.05) 0 2px, transparent 2px 6px),
      linear-gradient(160deg, color-mix(in srgb, var(--accent-cyan) 55%, var(--screen-bg-1)), color-mix(in srgb, var(--accent-cyan) 30%, var(--screen-bg-2)));
    box-shadow: inset 0 3px 8px rgba(0,0,0,0.6), 0 0 18px 2px color-mix(in srgb, var(--accent-cyan) 60%, transparent);
  }
  .scan-ring{ fill:none; stroke:var(--screen-line); stroke-width:1.4; }
  .scan-tick{ stroke:var(--screen-line); stroke-width:2; }
  .scan-dish{ fill:var(--screen-line); }
  .scan-core{ fill:#eef2f5; }
  #scanPupil{ fill:var(--accent-red); transition: fill 0.15s ease; transform-box:fill-box; transform-origin:center; }
  .scan-ring.spin{ transform-origin:60px 35px; animation: spin 9s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  #scanPupil.talking{ animation: pulse 0.35s ease; }
  @keyframes pulse{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.35); } }

  .board-row{
    display:flex;
    align-items:stretch;
    gap:8px;
  }

  .board{
    flex:1;
    display:grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr;
    gap:8px;
    aspect-ratio:1/1;
  }

  .pad{
    border:none;
    border-radius:10px;
    cursor:pointer;
    background: linear-gradient(180deg,
      color-mix(in srgb, var(--pad-color) 65%, white) 0%,
      var(--pad-color) 50%,
      color-mix(in srgb, var(--pad-color) 78%, black) 100%);
    box-shadow:
      inset 0 2px 0 rgba(255,255,255,0.35),
      inset 0 -4px 7px rgba(0,0,0,0.3),
      0 3px 6px rgba(0,0,0,0.25);
    opacity:0.62;
    transition: transform 0.08s ease, opacity 0.12s ease, box-shadow 0.08s ease;
  }
  .pad:disabled{ cursor:default; }
  .pad.lit{
    opacity:1;
    transform: scale(0.96);
    box-shadow:
      inset 0 2px 0 rgba(255,255,255,0.55),
      inset 0 -4px 7px rgba(0,0,0,0.22),
      0 0 20px 3px var(--pad-color);
  }
  .pad:not(:disabled):hover{ opacity:0.85; }
  .pad.victory{
    opacity:1;
    background: linear-gradient(180deg,
      color-mix(in srgb, var(--accent-cyan) 65%, white) 0%,
      var(--accent-cyan) 50%,
      color-mix(in srgb, var(--accent-cyan) 78%, black) 100%);
    box-shadow: 0 0 22px 4px var(--accent-cyan);
    transition: background 0.25s ease, box-shadow 0.25s ease, opacity 0.25s ease;
  }

  .side-rail{
    width:16px;
    display:flex;
    flex-direction:column;
    gap:6px;
  }
  .pip{
    flex:1;
    border-radius:5px;
    background: color-mix(in srgb, var(--pip-off) 35%, transparent);
    border:1px solid rgba(0,0,0,0.25);
    box-shadow: inset 0 1px 2px rgba(0,0,0,0.3);
    transition: background 0.15s ease, box-shadow 0.15s ease;
  }
  .pip.lit{
    background: var(--accent-cyan);
    box-shadow: 0 0 10px 1px var(--accent-cyan), inset 0 1px 2px rgba(255,255,255,0.4);
  }

  .vent-wrap{
    --vent-color: var(--accent-red);
    position:absolute;
    right:-30px;
    top:50%;
    transform:translateY(-50%);
    width:26px;
    height:54px;
    filter: drop-shadow(0 2px 6px rgba(0,0,0,0.4));
    transition: filter 0.25s ease;
  }
  .vent-wrap.victory{
    --vent-color: var(--accent-cyan);
    filter: drop-shadow(0 2px 10px var(--accent-cyan));
  }
  .vent-svg{ width:100%; height:100%; display:block; overflow:visible; }
  .vent-dome{ fill:#000000; }
  .vent-spoke{
    stroke: var(--vent-color);
    stroke-width:1.6;
    stroke-linecap:round;
    opacity:1;
    transition: opacity 0.35s ease, stroke 0.25s ease;
  }
  .vent-spoke.gone{ opacity:0; }

  .wordmark{
    font-size: clamp(18px,4.6vw,24px);
    line-height:1;
    margin:0;
    color: var(--text);
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
  }
  .wordmark span{
    display:inline-block;
    cursor:pointer;
    transition: transform 0.25s ease;
    text-shadow:0 2px 6px var(--text-shadow);
  }
  .wordmark span:active{ transform: scale(0.85) !important; }

  .tagline{
    font-weight:800;
    font-size:12px;
    text-align:center;
    opacity:0.9;
    max-width:380px;
    line-height:1.45;
    margin:0;
    padding:7px 13px;
    border-radius:12px;
    background: var(--tagline-bg);
    border:1px solid var(--tagline-border);
  }

  .stats{
    display:flex;
    gap:10px;
    font-family:'Space Mono', monospace;
    font-size:12px;
    letter-spacing:0.04em;
  }
  .stat{
    background: var(--tagline-bg);
    border:1px solid var(--tagline-border);
    border-radius:10px;
    padding:5px 12px;
    text-transform:uppercase;
  }
  .stat b{ font-size:14px; display:block; margin-top:2px; letter-spacing:0; }

  .level-restart-btn{
    display:none;
    align-items:center;
    justify-content:center;
    width:30px;
    height:30px;
    border:none;
    border-radius:50%;
    cursor:pointer;
    font-size:16px;
    line-height:1;
    color:#fff;
    background: linear-gradient(180deg,
      color-mix(in srgb, var(--bg-deep) 75%, white) 0%,
      var(--bg-deep) 45%,
      color-mix(in srgb, var(--bg-deep) 80%, black) 100%);
    box-shadow:
      inset 0 2px 0 rgba(255,255,255,0.4),
      inset 0 -3px 6px rgba(0,0,0,0.28),
      0 4px 8px rgba(0,0,0,0.25);
    transition: transform 0.1s ease;
  }
  .level-restart-btn.show{ display:flex; }
  .level-restart-btn:hover{ transform: translateY(-2px); }
  .level-restart-btn:active{ transform: translateY(1px); }

  .status{
    font-family:'Space Mono', monospace;
    font-size:13px;
    min-height:18px;
    text-align:center;
    opacity:0.9;
  }
  .status.err{ color:#ffb3b3; }
  .status.victory{ color: var(--accent-cyan); text-shadow:0 0 8px color-mix(in srgb, var(--accent-cyan) 60%, transparent); }
  .stat.victory{ border-color: var(--accent-cyan); box-shadow:0 0 8px color-mix(in srgb, var(--accent-cyan) 50%, transparent); transition: border-color 0.25s ease, box-shadow 0.25s ease; }
  #scannerSvg{ transition: opacity 0.25s ease; }
  #scannerSvg.gone{ opacity:0; }

  .start-btn{
    border:none;
    border-radius:14px;
    padding:9px 24px;
    font-family:'Nunito', sans-serif;
    font-weight:800;
    font-size:14px;
    color:#fff;
    letter-spacing:0.02em;
    cursor:pointer;
    background: linear-gradient(180deg,
      color-mix(in srgb, var(--bg-deep) 75%, white) 0%,
      var(--bg-deep) 45%,
      color-mix(in srgb, var(--bg-deep) 80%, black) 100%);
    box-shadow:
      inset 0 2px 0 rgba(255,255,255,0.4),
      inset 0 -4px 8px rgba(0,0,0,0.28),
      0 6px 12px rgba(0,0,0,0.25);
    transition: transform 0.1s ease;
  }
  .start-btn:hover{ transform: translateY(-2px); }
  .start-btn:active{ transform: translateY(1px); }

  /* ---------- game picker: same bordered-chip look as home-link ---------- */
  .game-picker{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:6px;
  }
  .game-tab{
    font-family:'Space Mono', monospace;
    font-size:11px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color: var(--text);
    background: var(--tagline-bg);
    border:1px solid var(--tagline-border);
    border-radius:6px;
    padding:5px 10px;
    cursor:pointer;
    opacity:0.7;
    transition: opacity 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
  }
  .game-tab:hover{ opacity:1; }
  .game-tab[aria-selected="true"]{
    opacity:1;
    border-color: var(--accent-cyan);
    box-shadow: 0 0 8px color-mix(in srgb, var(--accent-cyan) 50%, transparent);
  }

  /* the Signal Sequence wrapper must not break the panel's flex/gap
     layout, so it lays its children out as if it weren't there */
  .game-view{ display:contents; }
  .game-view[hidden]{ display:none; }

  /* ---------- arcade games (Flappy Robot / Snake / Reflex) ---------- */
  .arcade{
    flex:1;
    min-height:0;
    width:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:8px;
  }
  .arcade[hidden]{ display:none; }
  .arcade-stage{
    flex:1;
    min-height:120px;
    width:100%;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  #arcade-canvas{
    display:block;
    border-radius:12px;
    border:1px solid rgba(0,0,0,0.4);
    box-shadow: 0 14px 26px rgba(0,0,0,0.3);
    touch-action:none;
    cursor:pointer;
  }
  .arcade-score{
    font-family:'Space Mono', monospace;
    font-size:12px;
    letter-spacing:0.04em;
    text-transform:uppercase;
    background: var(--tagline-bg);
    border:1px solid var(--tagline-border);
    border-radius:10px;
    padding:5px 12px;
    margin:0;
  }
  .arcade-hint{
    font-weight:800;
    font-size:12px;
    opacity:0.85;
    margin:0;
    text-align:center;
  }
  .dpad{
    display:none;
    grid-template-columns: repeat(3, 44px);
    grid-template-rows: repeat(2, 36px);
    gap:5px;
  }
  .dpad.show{ display:grid; }
  .dpad button{
    border-radius:9px;
    font-size:16px;
    color: var(--text);
    background: var(--tagline-bg);
    border:1px solid var(--tagline-border);
    cursor:pointer;
    touch-action: manipulation;
  }
  .dpad button:active{ transform: translateY(2px); }
  .dpad [data-dir="up"]{ grid-column:2; grid-row:1; }
  .dpad [data-dir="left"]{ grid-column:1; grid-row:2; }
  .dpad [data-dir="down"]{ grid-column:2; grid-row:2; }
  .dpad [data-dir="right"]{ grid-column:3; grid-row:2; }
</style>
</head>
<body>

  <main class="panel">
    <a class="home-link" href="index.html">&larr; home</a>
    <button class="sound-toggle" id="sound-toggle-btn" type="button" aria-label="Toggle sound">
      <svg viewBox="0 0 24 24" fill="currentColor"><path id="sound-toggle-icon" d=""/></svg>
    </button>

    <h1 class="wordmark" id="wordmark">
      <span>S</span><span>I</span><span>G</span><span>N</span><span>A</span><span>L</span><span>&nbsp;</span><span>S</span><span>E</span><span>Q</span><span>U</span><span>E</span><span>N</span><span>C</span><span>E</span>
    </h1>

    <div class="game-picker" role="tablist" aria-label="Games">
      <button class="game-tab" role="tab" type="button" data-game="signal">signal</button>
      <button class="game-tab" role="tab" type="button" data-game="flappy">flappy</button>
      <button class="game-tab" role="tab" type="button" data-game="snake">snake</button>
      <button class="game-tab" role="tab" type="button" data-game="reflex">reflex</button>
    </div>

    <div class="game-view" id="view-signal">
    <div class="device">
      <div class="screen">
        <svg viewBox="0 0 120 70" id="scannerSvg">
          <circle class="scan-ring spin" cx="60" cy="35" r="24"/>
          <circle class="scan-ring" cx="60" cy="35" r="24" stroke-dasharray="3 5" opacity="0.5"/>
          <line class="scan-tick" x1="20" y1="18" x2="33" y2="26"/>
          <line class="scan-tick" x1="100" y1="18" x2="87" y2="26"/>
          <circle class="scan-core" cx="60" cy="35" r="13"/>
          <circle id="scanPupil" cx="60" cy="35" r="6"/>
        </svg>
      </div>

      <div class="board-row">
        <div class="board" id="board"></div>
        <div class="side-rail" id="sideRail">
          <span class="pip" data-pip="2"></span>
          <span class="pip" data-pip="1"></span>
          <span class="pip" data-pip="0"></span>
        </div>
      </div>

      <span class="vent-wrap" id="ventWrap">
        <svg class="vent-svg" id="ventSvg" viewBox="0 0 50 100" preserveAspectRatio="xMidYMid meet"></svg>
      </span>
    </div>

    <p class="tagline">watch the pattern, repeat it back. every beep is synthesized live, nothing sampled. loosely inspired by a certain trash-compacting robot, no relation otherwise.</p>

    <div class="stats">
      <div class="stat">level<b id="levelVal">0</b></div>
      <button class="level-restart-btn" id="levelRestartBtn" aria-label="Restart" title="Restart">&#8635;</button>
    </div>

    <p class="status" id="status">press start to begin</p>
    <button class="start-btn" id="startBtn">start</button>
    </div>

    <div class="arcade" id="view-arcade" hidden>
      <div class="arcade-stage" id="arcade-stage">
        <canvas id="arcade-canvas" width="360" height="440" tabindex="0" aria-label="Game area"></canvas>
      </div>
      <p class="arcade-score" id="arcade-score" aria-live="polite"></p>
      <p class="arcade-hint" id="arcade-hint"></p>
      <div class="dpad" id="arcade-dpad" aria-label="Snake controls">
        <button type="button" data-dir="up" aria-label="Up">&#9650;</button>
        <button type="button" data-dir="left" aria-label="Left">&#9664;</button>
        <button type="button" data-dir="down" aria-label="Down">&#9660;</button>
        <button type="button" data-dir="right" aria-label="Right">&#9654;</button>
      </div>
    </div>
  </main>

<script>
  // -----------------------------------------------------------
  // Signal Sequence -- a Simon-says style memory game. Every pad
  // sound is synthesized live with the Web Audio API (short
  // oscillator sweeps), nothing is a recorded/sampled clip.
  //
  // To change a pad's sound/color: edit its entry in PADS below.
  // To change difficulty ramp: edit SPEED_START / SPEED_FLOOR /
  // SPEED_STEP near the game state section.
  // -----------------------------------------------------------

  // -----------------------------------------------------------
  // Sound toggle -- same single-button, single-key pattern as the
  // theme toggle on other pages, but mutes audio site-wide. Shared
  // localStorage key, so muting/unmuting here carries over to every
  // other page (and vice versa). Defaults to "on".
  // -----------------------------------------------------------
  const SOUND_KEY = 'robot632_sound';
  const SOUND_ICONS = {
    on: 'M13.5 4.06c0-1.336-1.616-2.005-2.56-1.06l-4.5 4.5H4.508c-1.141 0-2.318.664-2.66 1.905A9.76 9.76 0 0 0 1.5 12c0 .898.121 1.768.35 2.595.341 1.24 1.518 1.905 2.659 1.905h1.93l4.5 4.5c.945.945 2.561.276 2.561-1.06V4.06ZM18.584 5.106a.75.75 0 0 1 1.06 0c3.808 3.807 3.808 9.98 0 13.788a.75.75 0 0 1-1.06-1.06 8.25 8.25 0 0 0 0-11.668.75.75 0 0 1 0-1.06Z M15.932 7.757a.75.75 0 0 1 1.061 0 6 6 0 0 1 0 8.486.75.75 0 0 1-1.06-1.06 4.5 4.5 0 0 0 0-6.366.75.75 0 0 1 0-1.06Z',
    off: 'M13.5 4.06c0-1.336-1.616-2.005-2.56-1.06l-4.5 4.5H4.508c-1.141 0-2.318.664-2.66 1.905A9.76 9.76 0 0 0 1.5 12c0 .898.121 1.768.35 2.595.341 1.24 1.518 1.905 2.659 1.905h1.93l4.5 4.5c.945.945 2.561.276 2.561-1.06V4.06ZM17.78 9.22a.75.75 0 1 0-1.06 1.06L18.44 12l-1.72 1.72a.75.75 0 0 0 1.06 1.06L19.5 13.06l1.72 1.72a.75.75 0 1 0 1.06-1.06L20.56 12l1.72-1.72a.75.75 0 0 0-1.06-1.06L19.5 10.94l-1.72-1.72Z'
  };

  function getSound(){
    return localStorage.getItem(SOUND_KEY) === 'off' ? 'off' : 'on';
  }

  function applySound(state){
    localStorage.setItem(SOUND_KEY, state);
    const icon = document.getElementById('sound-toggle-icon');
    if (icon) icon.setAttribute('d', SOUND_ICONS[state]);
  }

  function toggleSound(){
    applySound(getSound() === 'on' ? 'off' : 'on');
  }

  window.robot632SoundOn = () => getSound() === 'on';

  document.getElementById('sound-toggle-icon').setAttribute('d', SOUND_ICONS[getSound()]);
  document.getElementById('sound-toggle-btn').addEventListener('click', toggleSound);

  let audioCtx;
  function getCtx(){
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }

  // one short pitch-swept tone. freqStart/freqEnd in Hz, duration
  // in seconds, delay = when to start relative to now (seconds).
  // No-ops entirely when sound is muted.
  function tone(freqStart, freqEnd, duration, delay, type, peak){
    if (!window.robot632SoundOn()) return;
    type = type || 'sine';
    peak = peak || 0.22;
    const c = getCtx();
    const t0 = c.currentTime + delay;
    const osc = c.createOscillator();
    const gain = c.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(Math.max(freqStart, 1), t0);
    osc.frequency.exponentialRampToValueAtTime(Math.max(freqEnd, 1), t0 + duration);
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.exponentialRampToValueAtTime(peak, t0 + duration * 0.2);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + duration);
    osc.connect(gain).connect(c.destination);
    osc.start(t0);
    osc.stop(t0 + duration + 0.02);
  }

  const PADS = [
    { id: 0, color: '#7d5aa6', play: () => tone(392, 392, 0.22, 0, 'sine', 0.22) },  // purple, top-left
    { id: 1, color: '#a8ab48', play: () => tone(494, 494, 0.22, 0, 'sine', 0.22) },  // olive, top-right
    { id: 2, color: '#a1433f', play: () => tone(587, 587, 0.22, 0, 'sine', 0.22) },  // maroon, bottom-left
    { id: 3, color: '#3f8f96', play: () => tone(659, 659, 0.22, 0, 'sine', 0.22) }   // teal, bottom-right
  ];

  function failSound(){
    tone(300, 90, 0.5, 0, 'sawtooth', 0.2);
  }
  function winRoundSound(){
    tone(700, 900, 0.08, 0, 'sine', 0.18);
    tone(900, 1300, 0.1, 0.09, 'sine', 0.18);
  }
  function tickSound(){
    tone(950, 700, 0.09, 0, 'square', 0.12);
  }

  // -----------------------------------------------------------
  // Game state
  // -----------------------------------------------------------
  const SPEED_START = 700;  // ms per step at level 1
  const SPEED_FLOOR  = 280; // fastest it'll ever get
  const SPEED_STEP   = 25;  // ms shaved off per level

  const START_LENGTH = 3;   // sequence length at level 1
  const MAX_LEVEL     = 3;  // level 1 -> 3 steps, level 2 -> 4, level 3 -> 5, then victory

  const ROUND_TIME_MS = 8000; // player has 8s per round -- the vent doubles as the countdown

  let sequence = [];
  let seqTimers = []; // pending playback/next-round timeouts, see pauseSignal()
  let playerIndex = 0;
  let level = 0;
  let accepting = false;

  const board = document.getElementById('board');
  const statusEl = document.getElementById('status');
  const levelVal = document.getElementById('levelVal');
  const startBtn = document.getElementById('startBtn');
  const levelRestartBtn = document.getElementById('levelRestartBtn');
  const pupil = document.getElementById('scanPupil');
  const scannerSvg = document.getElementById('scannerSvg');
  const screenEl = document.querySelector('.screen');
  const ventSvg = document.getElementById('ventSvg');
  const ventWrap = document.getElementById('ventWrap');
  const pipEls = Array.from(document.querySelectorAll('.pip'));
  const statEls = Array.from(document.querySelectorAll('.stat'));

  // -----------------------------------------------------------
  // Vent: a half-circle of 16 radiating spokes glued to the
  // outer edge of the device, flat side against the panel. It
  // doubles as the round timer -- 2 spokes vanish (with a tick)
  // every second, so all 16 are gone after the full 8s. The
  // first and last spokes sit exactly 180deg apart (top and
  // bottom of the flat edge).
  // -----------------------------------------------------------
  const SPOKE_COUNT = 28;
  const NS = 'http://www.w3.org/2000/svg';
  function buildVent(){
    const dome = document.createElementNS(NS, 'path');
    dome.setAttribute('d', 'M0,2 A48,48 0 0 1 0,98 Z');
    dome.setAttribute('class', 'vent-dome');
    ventSvg.appendChild(dome);

    for (let i = 0; i < SPOKE_COUNT; i++){
      const angle = (-90 + i * (180 / (SPOKE_COUNT - 1))) * Math.PI / 180;
      const innerR = 6, outerR = 46;
      const x1 = innerR * Math.cos(angle), y1 = 50 + innerR * Math.sin(angle);
      const x2 = outerR * Math.cos(angle), y2 = 50 + outerR * Math.sin(angle);
      const line = document.createElementNS(NS, 'line');
      line.setAttribute('x1', x1.toFixed(2));
      line.setAttribute('y1', y1.toFixed(2));
      line.setAttribute('x2', x2.toFixed(2));
      line.setAttribute('y2', y2.toFixed(2));
      line.setAttribute('class', 'vent-spoke');
      line.dataset.index = i;
      ventSvg.appendChild(line);
    }
  }
  buildVent();
  const spokeEls = Array.from(ventSvg.querySelectorAll('.vent-spoke'));

  function resetVent(){
    spokeEls.forEach(s => s.classList.remove('gone'));
  }

  let roundTimer = null;

  // removes 2 spokes every second (with a tick) until all are gone,
  // then fires timeUp(). Call stopRoundTimer() to cancel early.
  function startRoundTimer(timeUp){
    resetVent();
    let i = 0;
    roundTimer = setInterval(() => {
      if (i < spokeEls.length) spokeEls[i].classList.add('gone');
      if (i + 1 < spokeEls.length) spokeEls[i + 1].classList.add('gone');
      tickSound();
      i += 2;
      if (i >= spokeEls.length){
        clearInterval(roundTimer);
        roundTimer = null;
        if (timeUp) timeUp();
      }
    }, ROUND_TIME_MS / (SPOKE_COUNT / 2));
  }

  function stopRoundTimer(){
    if (roundTimer){
      clearInterval(roundTimer);
      roundTimer = null;
    }
  }

  function renderBoard(){
    board.innerHTML = PADS.map(p => `
      <button class="pad" style="--pad-color:${p.color}" data-id="${p.id}" aria-label="Pad ${p.id+1}" disabled></button>
    `).join('');
  }
  renderBoard();
  const padEls = Array.from(board.querySelectorAll('.pad'));

  function setStatus(text, mode){
    statusEl.textContent = text;
    statusEl.classList.toggle('err', mode === 'err');
    statusEl.classList.toggle('victory', mode === 'victory');
  }

  function speedForLevel(lvl){
    return Math.max(SPEED_FLOOR, SPEED_START - (lvl - 1) * SPEED_STEP);
  }

  function litPad(id, ms){
    const el = padEls[id];
    el.classList.add('lit');
    pupil.classList.add('talking');
    setTimeout(() => {
      el.classList.remove('lit');
      pupil.classList.remove('talking');
    }, ms);
  }

  // side-rail bars track the current LEVEL, not round progress:
  // 1 bar lit at level 1, 2 bars at level 2, 3 bars at level 3.
  function updatePips(count){
    pipEls.forEach((pip, i) => {
      pip.classList.toggle('lit', i >= (pipEls.length - count));
    });
  }

  function resetVisuals(){
    padEls.forEach(p => p.classList.remove('victory'));
    resetVent();
    ventWrap.classList.remove('victory');
    scannerSvg.classList.remove('gone');
    screenEl.classList.remove('victory');
    statEls.forEach(s => s.classList.remove('victory'));
    levelRestartBtn.classList.remove('show');
    setStatus('press start to begin');
  }

  function startGame(){
    clearTimeout(autoStartTimer);
    seqTimers.forEach(clearTimeout);
    seqTimers = [];
    stopRoundTimer();
    sequence = [];
    level = 0;
    playerIndex = 0;
    accepting = false;
    startBtn.textContent = 'restart';
    resetVisuals();
    updatePips(0);
    nextRound();
  }

  function nextRound(){
    stopRoundTimer();
    resetVent();
    level++;
    if (level > MAX_LEVEL){
      triggerVictory();
      return;
    }
    if (level === 1){
      for (let i = 0; i < START_LENGTH; i++) sequence.push(Math.floor(Math.random() * PADS.length));
    } else {
      sequence.push(Math.floor(Math.random() * PADS.length));
    }
    playerIndex = 0;
    levelVal.textContent = level;
    setStatus('watch...');
    updatePips(level);
    padEls.forEach(p => p.disabled = true);
    playSequence();
  }

  function later(fn, ms){
    seqTimers.push(setTimeout(fn, ms));
  }

  // called by the game picker when switching away: drops whatever
  // round is in flight and leaves the board ready for "start"
  function pauseSignal(){
    clearTimeout(autoStartTimer);
    seqTimers.forEach(clearTimeout);
    seqTimers = [];
    stopRoundTimer();
    accepting = false;
    sequence = [];
    level = 0;
    levelVal.textContent = 0;
    padEls.forEach(p => { p.disabled = true; p.classList.remove('lit'); });
    resetVisuals();
    updatePips(0);
    startBtn.textContent = 'start';
  }

  function playSequence(){
    const step = speedForLevel(level);
    sequence.forEach((padId, i) => {
      later(() => {
        PADS[padId].play();
        litPad(padId, step * 0.6);
      }, i * step);
    });
    later(() => {
      accepting = true;
      padEls.forEach(p => p.disabled = false);
      setStatus('your turn');
      startRoundTimer(() => handleFail("time's up"));
    }, sequence.length * step + 150);
  }

  // fast win: everything flips to the cyan "won" state within
  // 0.25s (the CSS transitions above are what do the work) and
  // just stays there -- no long drawn-out sequence.
  function triggerVictory(){
    accepting = false;
    stopRoundTimer();
    padEls.forEach(p => p.disabled = true);
    setStatus('you won!', 'victory');
    updatePips(3);
    scannerSvg.classList.add('gone');
    screenEl.classList.add('victory');
    ventWrap.classList.add('victory');
    padEls.forEach(p => p.classList.add('victory'));
    statEls.forEach(s => s.classList.add('victory'));
    levelRestartBtn.classList.add('show');
  }

  function handleFail(reason){
    accepting = false;
    stopRoundTimer();
    padEls.forEach(p => p.disabled = true);
    failSound();
    pupil.classList.add('talking');
    setTimeout(() => pupil.classList.remove('talking'), 500);
    setStatus(`${reason} -- reached level ${level}. press start to try again.`, 'err');
    startBtn.textContent = 'start';
    levelRestartBtn.classList.add('show');
  }

  function handlePad(id){
    if (!accepting) return;
    PADS[id].play();
    litPad(id, 180);

    if (id !== sequence[playerIndex]){
      handleFail('missed it');
      return;
    }

    playerIndex++;
    if (playerIndex === sequence.length){
      accepting = false;
      stopRoundTimer();
      padEls.forEach(p => p.disabled = true);
      winRoundSound();
      later(nextRound, 500);
    }
  }

  board.addEventListener('click', (e) => {
    const btn = e.target.closest('.pad');
    if (!btn || btn.disabled) return;
    handlePad(parseInt(btn.dataset.id, 10));
  });

  startBtn.addEventListener('click', startGame);
  levelRestartBtn.addEventListener('click', startGame);

  // -----------------------------------------------------------
  // The panel has a fixed height and hides overflow, so on short
  // screens the device shrinks until the start button fits. The
  // device's height follows its width (square board + wide screen),
  // so shrinking the width by the overflow / height-per-width ratio
  // pulls everything below it back into view.
  // -----------------------------------------------------------
  const deviceEl = document.querySelector('.device');
  const panelMain = document.querySelector('.panel');
  const DEVICE_MAX_W = 340, DEVICE_MIN_W = 190;

  function fitDevice(){
    if (startBtn.offsetParent === null) return; // Signal Sequence isn't showing
    deviceEl.style.maxWidth = `${DEVICE_MAX_W}px`;
    const padBottom = parseFloat(getComputedStyle(panelMain).paddingBottom) || 0;
    const overflow = startBtn.getBoundingClientRect().bottom + padBottom - panelMain.getBoundingClientRect().bottom;
    if (overflow <= 0) return;
    const rect = deviceEl.getBoundingClientRect();
    const tallness = rect.height / rect.width;
    deviceEl.style.maxWidth = `${Math.max(DEVICE_MIN_W, Math.floor(rect.width - overflow / tallness))}px`;
  }
  new ResizeObserver(fitDevice).observe(panelMain);
  document.fonts.ready.then(fitDevice);

  // auto-start 5s after the page loads if nobody has hit start yet
  let autoStartTimer = setTimeout(startGame, 5000);
</script>

<script>
  // -----------------------------------------------------------
  // Title: same letter-cascade treatment as the home page --
  // a shared "font position" advances every cycle and the whole
  // title updates letter-by-letter in a quick cascade. Clicking
  // a letter bumps that letter permanently one font ahead.
  // -----------------------------------------------------------
  const FONTS = [
    { family: "'Nunito', sans-serif",        weight: 800, tilt: 0  },
    { family: "'Caveat', cursive",           weight: 700, tilt: -4 },
    { family: "'Bangers', cursive",          weight: 400, tilt: 3  },
    { family: "'Permanent Marker', cursive", weight: 400, tilt: -2 },
    { family: "'Kalam', cursive",            weight: 700, tilt: 5  },
    { family: "'Chewy', cursive",            weight: 400, tilt: -3 },
    { family: "'Rubik', sans-serif",         weight: 700, tilt: 2  }
  ];

  let titleLetters = Array.from(document.querySelectorAll('.wordmark span'));
  let titleOffsets = titleLetters.map(() => 0);
  let titleFontIndex = 0;

  function applyTitleFont(letter, i){
    const font = FONTS[(titleFontIndex + titleOffsets[i]) % FONTS.length];
    letter.style.fontFamily = font.family;
    letter.style.fontWeight = font.weight;
    letter.style.transform = `rotate(${font.tilt}deg)`;
  }

  function cascadeTitleFonts(){
    titleFontIndex = (titleFontIndex + 1) % FONTS.length;
    let i = 0;
    function nextLetter(){
      if (i < titleLetters.length){
        applyTitleFont(titleLetters[i], i);
        i++;
        setTimeout(nextLetter, 40);
      } else {
        setTimeout(cascadeTitleFonts, 2000);
      }
    }
    nextLetter();
  }

  function bounceTitleLetter(letter){
    letter.animate(
      [
        { transform: `${letter.style.transform} scale(1)`, offset: 0 },
        { transform: `${letter.style.transform} scale(0.75)`, offset: 0.08 },
        { transform: `${letter.style.transform} scale(1)`, offset: 1 }
      ],
      { duration: 500, easing: 'cubic-bezier(0.16, 1, 0.3, 1)', fill: 'none' }
    );
  }

  function bindTitleLetters(){
    titleLetters.forEach((letter, i) => {
      letter.addEventListener('click', () => {
        titleOffsets[i] = (titleOffsets[i] + 1) % FONTS.length;
        applyTitleFont(letter, i);
        bounceTitleLetter(letter);
      });
    });
  }
  bindTitleLetters();

  // used by the game picker: swaps the wordmark to another game's
  // name, one span per letter, in the current cascade font
  function setTitle(text){
    const wordmark = document.getElementById('wordmark');
    wordmark.innerHTML = Array.from(text).map(c => `<span>${c === ' ' ? '&nbsp;' : c}</span>`).join('');
    titleLetters = Array.from(wordmark.querySelectorAll('span'));
    titleOffsets = titleLetters.map(() => 0);
    titleLetters.forEach((letter, i) => applyTitleFont(letter, i));
    bindTitleLetters();
  }

  document.fonts.ready.then(() => {
    titleLetters.forEach((letter, i) => applyTitleFont(letter, i));
    cascadeTitleFonts();
  });
</script>

<script>
  // -----------------------------------------------------------
  // Game picker + arcade: Signal Sequence (above) is one choice;
  // Flappy Robot, Snake and Reflex share one canvas and one loop.
  // Each arcade game is an object with reset / press / update /
  // draw / scoreText (and optional turn / stop). Best scores live
  // in localStorage on this device only. Sounds go through tone()
  // from the Signal Sequence script, so they respect the mute.
  // The picked game is remembered, and a #flappy / #snake /
  // #reflex / #signal hash in the URL picks one directly.
  // -----------------------------------------------------------
  (function(){
    const W = 360, H = 440;
    const canvas = document.getElementById('arcade-canvas');
    const ctx = canvas.getContext('2d');
    const stage = document.getElementById('arcade-stage');
    const scoreEl = document.getElementById('arcade-score');
    const hintEl = document.getElementById('arcade-hint');
    const dpad = document.getElementById('arcade-dpad');
    const signalView = document.getElementById('view-signal');
    const arcadeView = document.getElementById('view-arcade');

    (function setupCanvas(){
      const dpr = Math.min(2, window.devicePixelRatio || 1);
      canvas.width = W * dpr;
      canvas.height = H * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    })();

    // fit the canvas inside whatever room the panel leaves, keeping
    // its 360x440 shape
    new ResizeObserver(() => {
      const scale = Math.min(stage.clientWidth / W, stage.clientHeight / H);
      canvas.style.width = `${Math.floor(W * scale)}px`;
      canvas.style.height = `${Math.floor(H * scale)}px`;
    }).observe(stage);

    // the arcade always draws on the device's dark screen colors
    const COLORS = { bg1: '#16323e', bg2: '#0a1c24', grid: 'rgba(180,205,215,0.10)', text: '#ffffff', shade: 'rgba(0,0,0,0.5)' };

    function getBest(key){
      try { const v = parseInt(localStorage.getItem(key), 10); return isNaN(v) ? null : v; } catch (e){ return null; }
    }
    function setBest(key, v){
      try { localStorage.setItem(key, v); } catch (e){}
    }

    function beep(freq, duration = 0.08, type = 'square', volume = 0.04){
      tone(freq, freq, duration, 0, type, volume * 3);
    }

    // ---------- shared drawing helpers ----------
    function rrect(x, y, w, h, r){
      ctx.beginPath();
      if (ctx.roundRect){ ctx.roundRect(x, y, w, h, r); return; }
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }

    function background(offset = 0){
      const g = ctx.createLinearGradient(0, 0, 0, H);
      g.addColorStop(0, COLORS.bg1);
      g.addColorStop(1, COLORS.bg2);
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, W, H);
      ctx.strokeStyle = COLORS.grid;
      ctx.lineWidth = 1;
      ctx.beginPath();
      for (let x = -(offset % 34); x < W; x += 34){ ctx.moveTo(x + 0.5, 0); ctx.lineTo(x + 0.5, H); }
      for (let y = 0; y < H; y += 34){ ctx.moveTo(0, y + 0.5); ctx.lineTo(W, y + 0.5); }
      ctx.stroke();
    }

    // the site's robot head, drawn at (x, y) with face width s
    function drawBot(x, y, s, opt = {}){
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(opt.angle || 0);
      // antenna
      ctx.fillStyle = '#7a828d';
      ctx.fillRect(-s * 0.04, -s * 0.78, s * 0.08, s * 0.3);
      ctx.beginPath();
      ctx.arc(0, -s * 0.8, s * 0.1, 0, Math.PI * 2);
      ctx.fillStyle = opt.light || '#e4e7eb';
      ctx.fill();
      // face
      const fg = ctx.createLinearGradient(-s / 2, -s / 2, s / 2, s / 2);
      fg.addColorStop(0, '#f6f7f8');
      fg.addColorStop(0.5, '#e4e7eb');
      fg.addColorStop(1, '#9aa1aa');
      rrect(-s / 2, -s / 2, s, s, s * 0.22);
      ctx.fillStyle = fg;
      ctx.fill();
      // visor
      rrect(-s * 0.38, -s * 0.14, s * 0.76, s * 0.36, s * 0.13);
      ctx.fillStyle = '#2c2f34';
      ctx.fill();
      // eyes
      const ex = opt.eyeX || 0, ey = opt.eyeY || 0;
      ctx.fillStyle = opt.eyeColor || '#ffffff';
      ctx.shadowColor = opt.eyeColor || 'rgba(255,255,255,0.8)';
      ctx.shadowBlur = s * 0.12;
      for (const side of [-1, 1]){
        ctx.beginPath();
        if (opt.closed) ctx.ellipse(side * s * 0.17 + ex, s * 0.04, s * 0.09, s * 0.018, 0, 0, Math.PI * 2);
        else ctx.arc(side * s * 0.17 + ex, s * 0.04 + ey, s * (opt.wide ? 0.105 : 0.08), 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }

    function centerText(text, y, size, alpha = 1){
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.font = `${size}px Bangers, 'Nunito', sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.lineWidth = 5;
      ctx.strokeStyle = COLORS.shade;
      ctx.strokeText(text, W / 2, y);
      ctx.fillStyle = COLORS.text;
      ctx.fillText(text, W / 2, y);
      ctx.restore();
    }

    function smallText(text, y){
      ctx.save();
      ctx.font = `800 15px Nunito, sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = COLORS.text;
      ctx.globalAlpha = 0.85;
      ctx.fillText(text, W / 2, y);
      ctx.restore();
    }

    // ===========================================================
    // Flappy Robot: tap to fire the thrusters, dodge the pillars.
    // ===========================================================
    const Flappy = (() => {
      const KEY = 'robot632_best_flappy';
      const GROUND = H - 40;
      const BX = 96, R = 15, PW = 58, GAP = 140, SPEED = 2.4;
      let s;

      function reset(){
        s = { state: 'ready', y: H / 2 - 30, vy: 0, pipes: [], score: 0, t: 0, scroll: 0, overAt: 0, flame: 0 };
        updateScore();
      }

      function flap(){
        s.vy = -7;
        s.flame = 8;
        beep(620, 0.05, 'square', 0.025);
      }

      function die(){
        s.state = 'over';
        s.overAt = performance.now();
        beep(140, 0.3, 'sawtooth', 0.04);
        const best = getBest(KEY);
        if (best === null || s.score > best) setBest(KEY, s.score);
        updateScore();
      }

      function press(){
        if (s.state === 'ready'){ s.state = 'play'; flap(); }
        else if (s.state === 'play') flap();
        else if (performance.now() - s.overAt > 450) reset();
      }

      function update(k){
        s.t += k;
        if (s.flame > 0) s.flame -= k;
        if (s.state !== 'over') s.scroll += SPEED * k;
        if (s.state === 'ready'){ s.y = H / 2 - 30 + Math.sin(s.t / 10) * 7; return; }
        if (s.state === 'over'){
          if (s.y < GROUND - R){ s.vy += 0.5 * k; s.y = Math.min(GROUND - R, s.y + s.vy * k); }
          return;
        }
        s.vy = Math.min(10, s.vy + 0.42 * k);
        s.y += s.vy * k;
        if (s.y < R){ s.y = R; s.vy = 0; }

        const last = s.pipes[s.pipes.length - 1];
        if (!last || last.x < W - 200) s.pipes.push({ x: W + 10, gapY: 50 + Math.random() * (GROUND - GAP - 100), passed: false });
        for (const p of s.pipes){
          p.x -= SPEED * k;
          if (!p.passed && p.x + PW < BX - R){
            p.passed = true;
            s.score++;
            beep(980, 0.07, 'triangle', 0.04);
            updateScore();
          }
        }
        s.pipes = s.pipes.filter(p => p.x > -PW - 10);

        if (s.y + R >= GROUND) return die();
        for (const p of s.pipes){
          if (BX + R - 3 > p.x && BX - R + 3 < p.x + PW && (s.y - R + 3 < p.gapY || s.y + R - 3 > p.gapY + GAP)) return die();
        }
      }

      function pillar(x, y, h, capAtBottom){
        const g = ctx.createLinearGradient(x, 0, x + PW, 0);
        g.addColorStop(0, '#5b626c');
        g.addColorStop(0.35, '#c3c8ce');
        g.addColorStop(1, '#4b525c');
        ctx.fillStyle = g;
        ctx.fillRect(x + 4, y, PW - 8, h);
        const capY = capAtBottom ? y + h - 16 : y;
        rrect(x, capY, PW, 16, 4);
        ctx.fill();
        // rivets on the cap
        ctx.fillStyle = 'rgba(255,255,255,0.7)';
        for (const rx of [x + 9, x + PW - 9]){
          ctx.beginPath();
          ctx.arc(rx, capY + 8, 2.5, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      function draw(){
        background(s.scroll * 0.3);
        for (const p of s.pipes){
          pillar(p.x, 0, p.gapY, true);
          pillar(p.x, p.gapY + GAP, GROUND - p.gapY - GAP, false);
        }
        // ground: hazard stripes
        ctx.fillStyle = '#2f3238';
        ctx.fillRect(0, GROUND, W, H - GROUND);
        ctx.fillStyle = '#ffc93c';
        for (let x = -(s.scroll % 24); x < W; x += 24){
          ctx.beginPath();
          ctx.moveTo(x, GROUND); ctx.lineTo(x + 12, GROUND); ctx.lineTo(x + 4, GROUND + 10); ctx.lineTo(x - 8, GROUND + 10);
          ctx.fill();
        }
        // thruster flame
        if (s.flame > 0 && s.state === 'play'){
          ctx.fillStyle = 'rgba(255,150,60,0.9)';
          ctx.beginPath();
          ctx.moveTo(BX - 8, s.y + R + 2);
          ctx.lineTo(BX + 8, s.y + R + 2);
          ctx.lineTo(BX, s.y + R + 6 + s.flame * 2);
          ctx.fill();
        }
        const angle = s.state === 'ready' ? 0 : Math.max(-0.5, Math.min(1.1, s.vy * 0.08));
        drawBot(BX, s.y, R * 2, { angle, closed: s.state === 'over', eyeX: 2 });

        if (s.state !== 'ready') centerText(String(s.score), 50, 46);
        if (s.state === 'ready'){
          centerText('Flappy Robot', H / 2 - 120, 40);
          smallText('tap, click or press space', H / 2 + 50);
        }
        if (s.state === 'over'){
          centerText('Crashed!', H / 2 - 40, 44);
          smallText('tap to try again', H / 2 + 6);
        }
      }

      function scoreText(){
        const best = getBest(KEY);
        return `score ${s.score} · best ${best === null ? '-' : best}`;
      }

      return { reset, press, update, draw, scoreText, hint: 'Tap / click / space to fire the thrusters. Dodge the pillars.' };
    })();

    // ===========================================================
    // Snake: a robot head collecting hex nuts.
    // ===========================================================
    const Snake = (() => {
      const KEY = 'robot632_best_snake';
      const C = 20, COLS = W / C, ROWS = H / C;
      let s;

      function placeNut(){
        let f;
        do { f = { x: Math.floor(Math.random() * COLS), y: Math.floor(Math.random() * ROWS) }; }
        while (s.body.some(b => b.x === f.x && b.y === f.y));
        s.nut = f;
      }

      function reset(){
        s = {
          state: 'ready',
          body: [{ x: 8, y: 11 }, { x: 7, y: 11 }, { x: 6, y: 11 }],
          dir: { x: 1, y: 0 },
          queue: [],
          acc: 0,
          interval: 150,
          score: 0,
          overAt: 0,
          t: 0
        };
        placeNut();
        updateScore();
      }

      function turn(dx, dy){
        if (s.state === 'over') return;
        if (s.state === 'ready') s.state = 'play';
        const last = s.queue.length ? s.queue[s.queue.length - 1] : s.dir;
        if ((last.x === -dx && last.y === -dy) || (last.x === dx && last.y === dy)) return;
        if (s.queue.length < 3) s.queue.push({ x: dx, y: dy });
      }

      function press(){
        if (s.state === 'ready') s.state = 'play';
        else if (s.state === 'over' && performance.now() - s.overAt > 450) reset();
      }

      function die(){
        s.state = 'over';
        s.overAt = performance.now();
        beep(140, 0.3, 'sawtooth', 0.04);
        const best = getBest(KEY);
        if (best === null || s.score > best) setBest(KEY, s.score);
        updateScore();
      }

      function step(){
        if (s.queue.length) s.dir = s.queue.shift();
        const head = s.body[0];
        const n = { x: head.x + s.dir.x, y: head.y + s.dir.y };
        const eating = n.x === s.nut.x && n.y === s.nut.y;
        const bodyToCheck = eating ? s.body : s.body.slice(0, -1); // the tail moves out of the way
        if (n.x < 0 || n.y < 0 || n.x >= COLS || n.y >= ROWS || bodyToCheck.some(b => b.x === n.x && b.y === n.y)) return die();
        s.body.unshift(n);
        if (eating){
          s.score++;
          s.interval = Math.max(70, s.interval - 4);
          beep(880, 0.06, 'triangle', 0.04);
          updateScore();
          placeNut();
        } else {
          s.body.pop();
        }
      }

      function update(k){
        s.t += k;
        if (s.state !== 'play') return;
        s.acc += k * (1000 / 60);
        while (s.acc >= s.interval && s.state === 'play'){
          s.acc -= s.interval;
          step();
        }
      }

      function nut(cx, cy, r){
        ctx.beginPath();
        for (let i = 0; i < 6; i++){
          const a = Math.PI / 6 + i * Math.PI / 3 + s.t * 0.03;
          ctx.lineTo(cx + Math.cos(a) * r, cy + Math.sin(a) * r);
        }
        ctx.closePath();
        ctx.fillStyle = '#ffc93c';
        ctx.fill();
        ctx.beginPath();
        ctx.arc(cx, cy, r * 0.38, 0, Math.PI * 2);
        ctx.fillStyle = COLORS.bg2;
        ctx.fill();
      }

      function draw(){
        background(0);
        nut(s.nut.x * C + C / 2, s.nut.y * C + C / 2, 7.5);
        for (let i = s.body.length - 1; i >= 1; i--){
          const b = s.body[i];
          rrect(b.x * C + 2, b.y * C + 2, C - 4, C - 4, 5);
          ctx.fillStyle = i % 2 ? '#c3c8ce' : '#9aa1aa';
          ctx.fill();
        }
        const h = s.body[0];
        drawBot(h.x * C + C / 2, h.y * C + C / 2 + 1, 18, {
          eyeX: s.dir.x * 1.5, eyeY: s.dir.y * 1.5, closed: s.state === 'over'
        });

        if (s.state === 'ready'){
          centerText('Snake', H / 2 - 90, 44);
          smallText('arrows, WASD, swipe or the pad below', H / 2 + 60);
        }
        if (s.state === 'over'){
          centerText('Game over', H / 2 - 30, 44);
          smallText('tap to play again', H / 2 + 16);
        }
      }

      function scoreText(){
        const best = getBest(KEY);
        return `nuts ${s.score} · best ${best === null ? '-' : best}`;
      }

      return { reset, press, turn, update, draw, scoreText, hint: 'Collect hex nuts, don\'t hit the walls or yourself.' };
    })();

    // ===========================================================
    // Reflex: wait for green, then tap as fast as you can.
    // ===========================================================
    const Reflex = (() => {
      const KEY = 'robot632_best_reflex';
      let s;

      function reset(){
        if (s) clearTimeout(s.timer);
        s = { state: 'idle', last: null, recent: [], timer: null, goAt: 0, t: 0 };
        updateScore();
      }

      function press(){
        const now = performance.now();
        if (s.state === 'wait'){
          clearTimeout(s.timer);
          s.state = 'early';
          beep(160, 0.2, 'sawtooth', 0.035);
        } else if (s.state === 'go'){
          s.last = Math.round(now - s.goAt);
          s.recent = [s.last, ...s.recent].slice(0, 5);
          s.state = 'result';
          const best = getBest(KEY);
          if (best === null || s.last < best) setBest(KEY, s.last);
          beep(1200, 0.05, 'triangle', 0.04);
          updateScore();
        } else {
          s.state = 'wait';
          s.timer = setTimeout(() => {
            s.state = 'go';
            s.goAt = performance.now();
            beep(880, 0.12, 'sine', 0.05);
          }, 1200 + Math.random() * 2800);
        }
      }

      function update(k){ s.t += k; }

      function draw(){
        const fills = { idle: null, wait: '#b8323a', go: '#2fb84f', early: '#e07a2c', result: '#2f6fed' };
        if (fills[s.state]){
          ctx.fillStyle = fills[s.state];
          ctx.fillRect(0, 0, W, H);
        } else {
          background(0);
        }
        const bob = Math.sin(s.t / 12) * 4;
        drawBot(W / 2, H / 2 - 40 + bob, 110, {
          wide: s.state === 'go',
          closed: s.state === 'early',
          eyeColor: s.state === 'wait' ? '#ff6b6b' : undefined
        });
        const saved = COLORS.text;
        if (fills[s.state]) COLORS.text = '#ffffff';
        if (s.state === 'idle'){ centerText('Reflex', 60, 44); smallText('tap to start, then wait for green', H - 70); }
        if (s.state === 'wait'){ centerText('wait for green...', H - 80, 34); }
        if (s.state === 'go'){ centerText('TAP!', H - 80, 56); }
        if (s.state === 'early'){ centerText('too soon!', H - 90, 40); smallText('tap to try again', H - 50); }
        if (s.state === 'result'){
          centerText(`${s.last} ms`, H - 95, 50);
          smallText(rating(s.last) + ' · tap to go again', H - 50);
        }
        COLORS.text = saved;
      }

      function rating(ms){
        if (ms < 200) return 'robot-level reflexes';
        if (ms < 260) return 'super fast';
        if (ms < 330) return 'nice';
        if (ms < 450) return 'not bad';
        return 'battery low?';
      }

      function scoreText(){
        const best = getBest(KEY);
        const avg = s.recent.length ? Math.round(s.recent.reduce((a, b) => a + b, 0) / s.recent.length) : null;
        return `best ${best === null ? '-' : best + ' ms'}` + (avg === null ? '' : ` · last ${s.recent.length} avg ${avg} ms`);
      }

      function stop(){ clearTimeout(s.timer); }

      return { reset, press, update, draw, scoreText, stop, hint: 'Tap the moment the screen turns green.' };
    })();

    // ===========================================================
    // Picker, input, and the shared loop
    // ===========================================================
    const ARCADE = { flappy: Flappy, snake: Snake, reflex: Reflex };
    const TITLES = { signal: 'SIGNAL SEQUENCE', flappy: 'FLAPPY ROBOT', snake: 'SNAKE', reflex: 'REFLEX' };
    const PAGE_TITLES = { signal: 'Signal Sequence', flappy: 'Flappy Robot', snake: 'Snake', reflex: 'Reflex' };
    const TAB_KEY = 'robot632_games_tab';
    let current = null;
    let currentName = null;
    let raf = null;
    let lastFrame = 0;

    function updateScore(){
      if (current) scoreEl.textContent = current.scoreText();
    }

    function loop(now){
      const dt = Math.min(50, now - (lastFrame || now));
      lastFrame = now;
      current.update(dt / (1000 / 60));
      current.draw();
      raf = requestAnimationFrame(loop);
    }

    function selectGame(name, remember){
      if (!TITLES[name]) name = 'signal';
      if (name === currentName) return;
      if (current && current.stop) current.stop();
      cancelAnimationFrame(raf);
      raf = null;
      if (currentName === 'signal') pauseSignal();
      if (currentName === null && name !== 'signal') clearTimeout(autoStartTimer); // no surprise auto-start

      currentName = name;
      current = ARCADE[name] || null;
      signalView.hidden = name !== 'signal';
      arcadeView.hidden = name === 'signal';
      setTitle(TITLES[name]);
      if (name === 'signal') fitDevice();
      document.title = `Robot632 // ${PAGE_TITLES[name]}`;
      document.querySelectorAll('.game-tab').forEach(t => {
        const on = t.dataset.game === name;
        t.setAttribute('aria-selected', on ? 'true' : 'false');
        t.tabIndex = on ? 0 : -1;
      });
      if (remember){
        try { localStorage.setItem(TAB_KEY, name); } catch (e){}
        history.replaceState(null, '', `#${name}`);
      }

      if (current){
        current.reset();
        hintEl.textContent = current.hint;
        dpad.classList.toggle('show', name === 'snake');
        updateScore();
        lastFrame = 0;
        raf = requestAnimationFrame(loop);
      }
    }

    const tabs = Array.from(document.querySelectorAll('.game-tab'));
    tabs.forEach((t, i) => {
      t.addEventListener('click', (e) => {
        selectGame(t.dataset.game, true);
        // mouse/touch picks hand the keyboard to the game right away
        if (e.detail > 0 && current) canvas.focus({ preventScroll: true });
      });
      // arrow keys move between tabs, like a normal tab list
      t.addEventListener('keydown', (e) => {
        const step = e.key === 'ArrowRight' ? 1 : e.key === 'ArrowLeft' ? -1 : 0;
        if (!step) return;
        e.preventDefault();
        const next = tabs[(i + step + tabs.length) % tabs.length];
        selectGame(next.dataset.game, true);
        next.focus();
      });
    });

    // tap / click: press, but on Snake a swipe turns instead
    let swipe = null;
    canvas.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      canvas.focus({ preventScroll: true });
      if (currentName === 'snake'){ swipe = { x: e.clientX, y: e.clientY }; return; }
      current.press();
    });
    canvas.addEventListener('pointerup', (e) => {
      if (currentName !== 'snake' || !swipe) return;
      const dx = e.clientX - swipe.x, dy = e.clientY - swipe.y;
      swipe = null;
      if (Math.max(Math.abs(dx), Math.abs(dy)) < 18){ current.press(); return; }
      if (Math.abs(dx) > Math.abs(dy)) Snake.turn(Math.sign(dx), 0);
      else Snake.turn(0, Math.sign(dy));
    });

    const DIRS = {
      ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0],
      w: [0, -1], s: [0, 1], a: [-1, 0], d: [1, 0]
    };
    document.addEventListener('keydown', (e) => {
      if (!current) return;
      if (e.target.closest && e.target.closest('.game-picker, a, .dpad, .sound-toggle')) return;
      const key = e.key.length === 1 ? e.key.toLowerCase() : e.key;
      if (currentName === 'snake' && DIRS[key]){
        e.preventDefault();
        Snake.turn(...DIRS[key]);
        return;
      }
      if (key === ' ' || key === 'Enter' || (currentName === 'flappy' && key === 'ArrowUp')){
        e.preventDefault();
        if (!e.repeat) current.press();
      }
    });

    dpad.querySelectorAll('button').forEach(b => {
      const map = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
      b.addEventListener('pointerdown', (e) => { e.preventDefault(); Snake.turn(...map[b.dataset.dir]); });
      b.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); Snake.turn(...map[b.dataset.dir]); }
      });
    });

    let saved = null;
    try { saved = localStorage.getItem(TAB_KEY); } catch (e){}
    const fromHash = location.hash.slice(1);
    selectGame(TITLES[fromHash] ? fromHash : saved, false);
  })();
</script>
