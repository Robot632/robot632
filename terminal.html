<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Robot632 // R632-SH</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=VT323&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  /* -----------------------------------------------------------
     R632-SH -- Robot632's retro shell. Phosphor-on-glass CRT,
     styled off the same teal the main site uses so it reads as
     the same robot, just with its access panel popped open.
  ------------------------------------------------------------ */
  :root{
    --glass: #061616;
    --phosphor: #4dffe0;
    --phosphor-dim: #1f7566;
    --phosphor-bright: #b8fff0;
    --amber: #ffb454;
    --amber-dim: #8a5c22;
    --err: #ff6f6f;
    --scan-opacity: 0.10;
  }

  *{ box-sizing:border-box; }

  html, body{
    margin:0;
    height:100%;
    background:#000;
  }

  body{
    display:flex;
    align-items:center;
    justify-content:center;
    padding: clamp(10px, 3vw, 28px);
    font-family:'Space Mono', monospace;
    overflow:hidden;
  }

  /* the "monitor" -- everything phosphor-colored lives inside this */
  .crt{
    position:relative;
    width:100%;
    max-width: 860px;
    height: min(640px, 92vh);
    background: radial-gradient(circle at 50% 20%, #0a2323, var(--glass) 75%);
    border-radius: 20px;
    border: 2px solid rgba(77,255,224,0.18);
    box-shadow:
      0 0 0 1px rgba(0,0,0,0.6),
      0 40px 80px rgba(0,0,0,0.6),
      inset 0 0 60px rgba(0,0,0,0.65);
    overflow:hidden;
    color: var(--phosphor);
    --accent: var(--phosphor);
    --accent-dim: var(--phosphor-dim);
    --accent-bright: var(--phosphor-bright);
    transition: box-shadow 0.4s ease;
  }
  .crt.amber{
    color: var(--amber);
    --accent: var(--amber);
    --accent-dim: var(--amber-dim);
    --accent-bright: #ffe2b0;
  }

  /* scanlines + vignette, sits above the text */
  .crt::before{
    content:'';
    position:absolute;
    inset:0;
    pointer-events:none;
    background: repeating-linear-gradient(
      to bottom,
      rgba(0,0,0,0) 0px,
      rgba(0,0,0,0) 2px,
      rgba(0,0,0,var(--scan-opacity)) 3px,
      rgba(0,0,0,0) 4px
    );
    z-index:3;
  }
  .crt::after{
    content:'';
    position:absolute;
    inset:0;
    pointer-events:none;
    box-shadow: inset 0 0 90px rgba(0,0,0,0.65);
    z-index:3;
  }

  @keyframes flicker{
    0%, 100% { opacity: 1; }
    92% { opacity: 1; }
    93% { opacity: 0.86; }
    94% { opacity: 1; }
  }
  @media (prefers-reduced-motion: no-preference){
    .crt{ animation: flicker 7s infinite; }
  }

  .bolt{
    position:absolute;
    width:7px;
    height:7px;
    border-radius:50%;
    background: radial-gradient(circle at 35% 30%, #fff, var(--accent-dim) 65%, #000);
    opacity:0.6;
    z-index:4;
  }
  .bolt.tl{ top:12px; left:14px; }
  .bolt.tr{ top:12px; right:14px; }

  .topbar{
    position:absolute;
    top:10px;
    left:0;
    right:0;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    font-family:'Space Mono', monospace;
    font-size:11px;
    letter-spacing:0.12em;
    color: var(--accent-dim);
    z-index:4;
    text-transform:uppercase;
  }

  .home-link{
    position:absolute;
    top:9px;
    right:16px;
    z-index:5;
    color: var(--accent-dim);
    text-decoration:none;
    font-family:'Space Mono', monospace;
    font-size:11px;
    letter-spacing:0.08em;
    border:1px solid var(--accent-dim);
    border-radius:6px;
    padding:3px 8px;
    transition: color 0.15s ease, border-color 0.15s ease;
    text-transform:uppercase;
  }
  .home-link:hover{ color: var(--accent-bright); border-color: var(--accent); }

  .screen{
    position:relative;
    z-index:2;
    height:100%;
    padding: 40px 22px 16px;
    overflow-y:auto;
    font-family:'VT323', monospace;
    font-size: clamp(16px, 2.3vh, 20px);
    line-height:1.35;
    text-shadow: 0 0 6px var(--accent-dim), 0 0 1px var(--accent);
    cursor:text;
  }
  .screen::-webkit-scrollbar{ width:8px; }
  .screen::-webkit-scrollbar-thumb{ background: var(--accent-dim); border-radius:4px; }

  pre.banner{
    margin: 0 0 10px;
    color: var(--accent-bright);
    font-size: clamp(9px, 1.6vw, 13px);
    line-height:1.15;
    white-space:pre;
  }

  .line{ white-space:pre-wrap; word-break:break-word; margin:0 0 2px; }
  .line.dim{ color: var(--accent-dim); }
  .line.err{ color: var(--err); text-shadow:0 0 6px rgba(255,111,111,0.5); }
  .line.accent{ color: var(--accent-bright); }

  .row{ display:flex; }
  .prompt{ flex-shrink:0; color: var(--accent-bright); margin-right:6px; }

  #inputLine{ display:flex; align-items:center; }
  #cmdInput{
    flex:1;
    background:transparent;
    border:none;
    outline:none;
    color: var(--accent-bright);
    font-family:'VT323', monospace;
    font-size: inherit;
    text-shadow: inherit;
    caret-color: var(--accent);
  }

  a.inline{ color: var(--accent-bright); }
</style>
</head>
<body>

  <div class="crt" id="crt">
    <span class="bolt tl"></span>
    <span class="bolt tr"></span>
    <div class="topbar">R632-SH · SERIAL 632-A</div>
    <a class="home-link" href="index.html">&larr; home</a>

    <div class="screen" id="screen" tabindex="-1">
      <div id="log"></div>
      <div class="row" id="inputLine" style="display:none;">
        <span class="prompt" id="promptLabel">guest@robot632:~$</span>
        <input id="cmdInput" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" />
      </div>
    </div>
  </div>

<script>
  // -----------------------------------------------------------
  // R632-SH -- modular retro shell for Robot632.
  //
  // To add a command: add a key to COMMANDS. Each handler takes
  // the raw argument string (everything after the command word)
  // and returns either a string, an array of strings (one per
  // line), or nothing (if the handler prints on its own, e.g.
  // async commands using print()/printLines()).
  //
  // Lines can carry a CSS class via "::class::text", e.g.
  // "::err::not found" renders in the error color. Leave the
  // "::class::" prefix off for a normal phosphor line.
  // -----------------------------------------------------------

  const PROMPT_USER = 'guest@robot632';

  const BANNER = String.raw`
   ___         ___    __ ___ ___
  | _ \___    / _ \  / /|__ \__ \
  |   / _ \  | (_) |/ _ \ / / / /
  |_|_\___/   \___/ \___//_/ /_/
  `;

  const COMMANDS = {
    vector(){
      return [
        'ORDER: Vector',
        'purchased: 31 July 2026',
        'status: not arrived (as of 21.08)',
        'will update you guys.'
      ];
    },
    hints(){
      return [
        "it's small, it drives, and it's definitely not Cozmo.",
        'six letters. starts with V.',
        'think: direction + magnitude.',
        "type it, and you'll get an update on where mine's at."
      ];
    }
  };
  // .about = shown if you build a listing off this later
  // .active = same idea as BUTTONS/SOCIALS visible flag on the
  //           homepage -- set to false to disable a command
  //           without deleting it. Inactive commands behave as
  //           if they don't exist (plain "command not found").
  COMMANDS.vector.about  = 'status of my order';
  COMMANDS.vector.active = true;
  COMMANDS.hints.about   = 'hints about the other command';
  COMMANDS.hints.active  = true;

  // -----------------------------------------------------------
  // Rendering helpers
  // -----------------------------------------------------------
  const log = document.getElementById('log');
  const screen = document.getElementById('screen');

  function lineEl(text){
    const div = document.createElement('div');
    let cls = 'line';
    let content = text;
    const m = /^::(\w+)::([\s\S]*)$/.exec(text);
    if (m){ cls += ' ' + m[1]; content = m[2]; }
    div.className = cls;
    div.textContent = content;
    return div;
  }

  function print(text){
    log.appendChild(lineEl(text));
    screen.scrollTop = screen.scrollHeight;
  }

  function printLines(lines){
    lines.forEach(print);
  }

  function printCommandEcho(cmdText){
    const row = document.createElement('div');
    row.className = 'row';
    const p = document.createElement('span');
    p.className = 'prompt';
    p.textContent = PROMPT_USER + ':~$';
    const t = document.createElement('span');
    t.textContent = ' ' + cmdText;
    row.appendChild(p);
    row.appendChild(t);
    log.appendChild(row);
  }

  // -----------------------------------------------------------
  // Boot sequence
  // -----------------------------------------------------------
  const BOOT_LINES = [
    '::dim::R632-SH boot sequence initiated...',
    '::dim::checking servos ......... OK',
    '::dim::checking antenna ........ OK',
    '::dim::loading personality ..... OK',
    '::dim::uplink to guzzoni ........ skipped',
    '',
  ];

  async function boot(){
    for (const l of BOOT_LINES){
      print(l);
      await sleep(120);
    }
    BANNER.split('\n').forEach(l => print('::accent::' + l));
    print('');
    print("type hints for command hints.");
    print('');
    document.getElementById('inputLine').style.display = 'flex';
    document.getElementById('cmdInput').focus();
  }

  function sleep(ms){ return new Promise(r => setTimeout(r, ms)); }

  // -----------------------------------------------------------
  // Input handling
  // -----------------------------------------------------------
  const input = document.getElementById('cmdInput');
  const history = [];
  let historyIndex = -1;

  function runCommand(raw){
    const trimmed = raw.trim();
    printCommandEcho(raw);
    if (!trimmed){ return; }

    history.push(raw);
    historyIndex = history.length;

    const [cmd, ...rest] = trimmed.split(/\s+/);
    const arg = trimmed.slice(cmd.length).trim();
    const handler = COMMANDS[cmd.toLowerCase()];

    if (!handler || handler.active === false){
      print(`::err::command not found: ${cmd} (try 'hints')`);
      return;
    }
    const result = handler(arg);
    if (typeof result === 'string') print(result);
    else if (Array.isArray(result)) printLines(result);
  }

  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter'){
      const val = input.value;
      input.value = '';
      runCommand(val);
    } else if (e.key === 'ArrowUp'){
      e.preventDefault();
      if (history.length){
        historyIndex = Math.max(0, historyIndex - 1);
        input.value = history[historyIndex] || '';
      }
    } else if (e.key === 'ArrowDown'){
      e.preventDefault();
      if (history.length){
        historyIndex = Math.min(history.length, historyIndex + 1);
        input.value = history[historyIndex] || '';
      }
    } else if (e.key === 'Escape'){
      window.location.href = 'index.html';
    }
  });

  screen.addEventListener('click', () => input.focus());

  boot();
</script>

</body>
</html>
