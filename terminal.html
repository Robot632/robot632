<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Robot632 // R632-SH</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=VT323&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='8' r='8' fill='%23e4e7eb'/><rect x='46' y='6' width='8' height='20' fill='%23e4e7eb'/><rect x='8' y='22' width='84' height='78' rx='15' fill='%23e4e7eb'/><rect x='20' y='46' width='60' height='28' rx='9' fill='%232c2f34'/><circle cx='38' cy='60' r='6.5' fill='%23e4e7eb'/><circle cx='62' cy='60' r='6.5' fill='%23e4e7eb'/></svg>">
<style>
  /* -----------------------------------------------------------
     R632-SH -- Robot632's retro shell. Phosphor-on-glass CRT,
     styled off the same teal the main site uses so it reads as
     the same robot, just with its access panel popped open.
  ------------------------------------------------------------ */
  :root{
    --glass: #061616;
    --phosphor: #4dffe0;
    --phosphor-dim: #1f7566;
    --phosphor-bright: #b8fff0;
    --amber: #ffb454;
    --amber-dim: #8a5c22;
    --err: #ff6f6f;
    --scan-opacity: 0.10;
  }

  *{ box-sizing:border-box; }

  html, body{
    margin:0;
    height:100%;
    background:#000;
  }

  body{
    display:flex;
    align-items:center;
    justify-content:center;
    padding: clamp(10px, 3vw, 28px);
    font-family:'Space Mono', monospace;
    overflow:hidden;
  }

  /* the "monitor" -- everything phosphor-colored lives inside this */
  .crt{
    position:relative;
    width:100%;
    max-width: 860px;
    height: min(640px, 92vh);
    background: radial-gradient(circle at 50% 20%, #0a2323, var(--gls) 75%);
    border-radius: 20px;
    border: 2px solid rgba(77,255,224,0.18);
    box-shadow:
      0 0 0 1px rgba(0,0,0,0.6),
      0 40px 80px rgba(0,0,0,0.6),
      inset 0 0 60px rgba(0,0,0,0.65);
    overflow:hidden;
    color: var(--phosphor);
    --accent: var(--phosphor);
    --accent-dim: var(--phosphor-dim);
    --accent-bright: var(--phosphor-bright);
    transition: box-shadow 0.4s ee;
  }
  .crt.amber{
    color: var(--amber);
    --accent: var(--amber);
    --accent-dim: var(--amber-dim);
    --accent-bright: #ffe2b0;
  }

  /* scanlines + vignette, sits above the text */
  .crt::before{
    content:'';
    position:absolute;
    inset:0;
    pointer-events:none;
    background: repeating-linear-gradient(
      to bottom,
      rgba(0,0,0,0) 0px,
      rgba(0,0,0,0) 2px,
      rgba(0,0,0,var(--scan-opacity)) 3px,
      rgba(0,0,0,0) 4px
    );
    z-index:3;
  }
  .crt::after{
    content:'';
    position:absolute;
    inset:0;
    pointer-events:none;
    box-shadow: inset 0 0 90px rgba(0,0,0,0.65);
    z-index:3;
  }

  @keyframes flicker{
    0%, 100% { opacity: 1; }
    92% { opacity: 1; }
    93% { opacity: 0.86; }
    94% { opacity: 1; }
  }
  @media (prefers-reduced-motion: no-preference){
    .crt{ animation: flicker 7s infinite; }
  }

  .header-bar{
    position:absolute;
    top:0;
    left:0;
    right:0;
    height:34px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    padding:0 14px;
    background: linear-gradient(to bottom, rgba(6,22,22,0.97), rgba(6,22,22,0.9));
    border-bottom:1px solid rgba(77,255,224,0.14);
    z-index:5;
  }

  .header-label{
    font-family:'Space Mono', monospace;
    font-size:11px;
    letter-spacing:0.12em;
    color: var(--accent-dim);
    text-transform:upperce;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }

  .home-link{
    flex-shrink:0;
    color: var(--accent-dim);
    text-decoration:none;
    font-family:'Space Mono', monospace;
    font-size:11px;
    letter-spacing:0.08em;
    border:1px solid var(--accent-dim);
    border-radius:6px;
    padding:3px 8px;
    transition: color 0.15s ee, border-color 0.15s ease;
    text-transform:uppercase;
  }
  .home-link:hover{ color: var(--accent-bright); border-color: var(--accent); }

  .header-controls{
    flex-shrink:0;
    display:flex;
    align-items:center;
    gap:8px;
  }

  /* icon swaps like the theme toggle on the other pages -- same
     bordered-chip look as the home link, just square instead of text */
  .sound-toggle{
    display:flex;
    align-items:center;
    justify-content:center;
    width:24px;
    height:24px;
    background:none;
    color: var(--accent-dim);
    border:1px solid var(--accent-dim);
    border-radius:6px;
    cursor:pointer;
    transition: color 0.15s ease, border-color 0.15s ease;
  }
  .sound-toggle:hover{ color: var(--accent-bright); border-color: var(--accent); }
  .sound-toggle svg{ width:13px; height:13px; }

  .screen{
    position:relative;
    z-index:2;
    height:100%;
    padding: 44px 22px 16px;
    overflow-y:auto;
    font-family:'VT323', monospace;
    font-size: clamp(16px, 2.3vh, 20px);
    line-height:1.35;
    text-shadow: 0 0 6px var(--accent-dim), 0 0 1px var(--accent);
    cursor:text;
  }
  .screen::-webkit-scrollbar{ width:8px; }
  .screen::-webkit-scrollbar-thumb{ background: var(--accent-dim); border-radius:4px; }

  /* banner lines get their own rule -- unlike .line below, these
     never wrap or break mid-character. VT323 (used for the rest of
     the terminal) isn't a strict fixed-width font, which is what
     was throwing the art out of alignment -- Space Mono is a real
     monospace, so every character takes the same width. */
  .line.banner-line{
    white-space:pre;
    word-break:normal;
    font-family:'Space Mono', monospace;
    font-variant-ligatures:none;
    letter-spacing:0;
    font-size: clamp(10px, 2.6vw, 16px);
    line-height:1.25;
    color: var(--accent-bright);
  }
  #log{ overflow-x:hidden; }

  .line{ white-space:pre-wrap; word-break:break-word; margin:0 0 2px; }
  .line.dim{ color: var(--accent-dim); }
  .line.err{ color: var(--err); text-shadow:0 0 6px rgba(255,111,111,0.5); }
  .line.accent{ color: var(--accent-bright); }

  .row{ display:flex; }
  .prompt{ flex-shrink:0; color: var(--accent-bright); margin-right:6px; }

  #inputLine{ display:flex; align-items:center; }
  #cmdInput{
    flex:1;
    background:transparent;
    border:none;
    outline:none;
    color: var(--accent-bright);
    font-family:'VT323', monospace;
    font-size: inherit;
    text-shadow: inherit;
    caret-color: var(--accent);
  }

  a.inline{ color: var(--accent-bright); }

  /* -----------------------------------------------------------
     Pre-boot splash -- shown on load, sits above the (empty) log
     and below the header bar, until the user presses Enter (or
     taps) to power the machine on.
  ------------------------------------------------------------ */
  .splash{
    position:absolute;
    inset:0;
    z-index:4;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:14px;
    text-align:center;
    padding: 34px 20px 0;
    cursor:pointer;
    user-select:none;
  }
  .splash.hidden{ display:none; }
  .splash-title{
    font-family:'Space Mono', monospace;
    font-weight:700;
    font-size: clamp(24px, 6vw, 42px);
    letter-spacing:0.22em;
    color: var(--accent-bright);
    text-shadow: 0 0 14px var(--accent-dim), 0 0 2px var(--accent);
  }
  .splash-sub{
    font-family:'Space Mono', monospace;
    font-size: clamp(11px, 2vw, 13px);
    letter-spacing:0.14em;
    color: var(--accent-dim);
    text-transform:uppercase;
  }
  .splash-prompt{
    margin-top:22px;
    font-family:'VT323', monospace;
    font-size: clamp(16px, 2.6vh, 20px);
    letter-spacing:0.08em;
    color: var(--accent-bright);
    animation: splash-blink 1.1s steps(1) infinite;
  }
  @keyframes splash-blink{
    0%, 49% { opacity: 1; }
    50%, 100% { opacity: 0; }
  }
</style>
</head>
<body>

  <div class="crt" id="crt">
    <div class="header-bar">
      <span class="header-label">R632-SH · SERIAL 632-A</span>
      <div class="header-controls">
        <button class="sound-toggle" id="sound-toggle-btn" type="button" aria-label="Toggle sound">
          <svg viewBox="0 0 24 24" fill="currentColor"><path id="sound-toggle-icon" d=""/></svg>
        </button>
        <a class="home-link" href="index.html">&larr; home</a>
      </div>
    </div>

    <div class="splash" id="splash">
      <div class="splash-title">ROBOT II COMPUTER</div>
      <div class="splash-sub">R632-SH · SERIAL 632-A</div>
      <div class="splash-prompt">PRESS ENTER TO BOOT</div>
    </div>

    <div class="screen" id="screen" tabindex="-1">
      <div id="log"></div>
      <div class="row" id="inputLine" style="display:none;">
        <span class="prompt" id="promptLabel">guest@robot632:~$</span>
        <input id="cmdInput" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" />
      </div>
    </div>
  </div>

<script>
  // -----------------------------------------------------------
  // R632-SH -- modular retro shell for Robot632.
  //
  // To add a command: add a key to COMMANDS. Each handler takes
  // the raw argument string (everything after the command word)
  // and returns either a string, an array of strings (one per
  // line), or nothing (if the handler prints on its own, e.g.
  // async commands using print()/printLines()).
  //
  // Lines can carry a CSS class via "::class::text", e.g.
  // "::err::not found" renders in the error color. Leave the
  // "::class::" prefix off for a normal phosphor line.
  // -----------------------------------------------------------

  // -----------------------------------------------------------
  // Sound toggle -- same single-button, single-key pattern as the
  // theme toggle on the other pages, but mutes audio site-wide.
  // Shared localStorage key, so muting/unmuting here carries over
  // to every other page (and vice versa). Defaults to "on". This
  // shell doesn't make any sound of its own yet, but any command
  // that does should check window.robot632SoundOn() first.
  // -----------------------------------------------------------
  const SOUND_KEY = 'robot632_sound';
  const SOUND_ICONS = {
    on: 'M13.5 4.06c0-1.336-1.616-2.005-2.56-1.06l-4.5 4.5H4.508c-1.141 0-2.318.664-2.66 1.905A9.76 9.76 0 0 0 1.5 12c0 .898.121 1.768.35 2.595.341 1.24 1.518 1.905 2.659 1.905h1.93l4.5 4.5c.945.945 2.561.276 2.561-1.06V4.06ZM18.584 5.106a.75.75 0 0 1 1.06 0c3.808 3.807 3.808 9.98 0 13.788a.75.75 0 0 1-1.06-1.06 8.25 8.25 0 0 0 0-11.668.75.75 0 0 1 0-1.06Z M15.932 7.757a.75.75 0 0 1 1.061 0 6 6 0 0 1 0 8.486.75.75 0 0 1-1.06-1.06 4.5 4.5 0 0 0 0-6.366.75.75 0 0 1 0-1.06Z',
    off: 'M13.5 4.06c0-1.336-1.616-2.005-2.56-1.06l-4.5 4.5H4.508c-1.141 0-2.318.664-2.66 1.905A9.76 9.76 0 0 0 1.5 12c0 .898.121 1.768.35 2.595.341 1.24 1.518 1.905 2.659 1.905h1.93l4.5 4.5c.945.945 2.561.276 2.561-1.06V4.06ZM17.78 9.22a.75.75 0 1 0-1.06 1.06L18.44 12l-1.72 1.72a.75.75 0 0 0 1.06 1.06L19.5 13.06l1.72 1.72a.75.75 0 1 0 1.06-1.06L20.56 12l1.72-1.72a.75.75 0 0 0-1.06-1.06L19.5 10.94l-1.72-1.72Z'
  };

  function getSound(){
    return localStorage.getItem(SOUND_KEY) === 'off' ? 'off' : 'on';
  }

  function applySound(state){
    localStorage.setItem(SOUND_KEY, state);
    const icon = document.getElementById('sound-toggle-icon');
    if (icon) icon.setAttribute('d', SOUND_ICONS[state]);
  }

  function toggleSound(){
    applySound(getSound() === 'on' ? 'off' : 'on');
  }

  window.robot632SoundOn = () => getSound() === 'on';

  document.getElementById('sound-toggle-icon').setAttribute('d', SOUND_ICONS[getSound()]);
  document.getElementById('sound-toggle-btn').addEventListener('click', toggleSound);

  const PROMPT_USER = 'guest@robot632';

  const BANNER = String.raw` ____   __  _________  
|  _ \ / /_|___ /___ \ 
| |_) | '_ \ |_ \ __) |
|  _ <| (_) |__) / __/ 
|_| \_\\___/____/_____|`;

  const COMMANDS = {
    vector(){
      return [
        'ORDER: Vector',
        'purchased: 31 July 2026',
        'status: not arrived (as of 21.08)',
        'will update you guys.',
        'as of 24.08 it will arrive tomorrow but i am at my grandparents(maybe will put a photo)'
      ];
    },
    devices(){
      return [
        'IOS 6 FLEET',
        '  iPhone 5     -- 64GB -- iOS 6.1.4',
        '  iPad 3rd gen -- 64GB -- iOS 6.1.3',
        '  iPhone 4     -- 16GB -- iOS 6.1.3',
        'old, but still kicking.'
      ];
    },
    hints(){
      return [
        "it's small, it drives, and it's definitely not Cozmo.",
        'six letters. starts with V.',
        'think: direction + magnitude.',
        "type it, and you'll get an update on where mine's at.",
        '',
        'also: three old apple bricks live in a drawer here.',
        "type what you'd call them, together, and see what's inside."
      ];
    }
  };
  // .about = shown if you build a listing off this later
  // .active = same idea as BUTTONS/SOCIALS visible flag on the
  //           homepage -- set to false to disable a command
  //           without deleting it. Inactive commands behave as
  //           if they don't exist (plain "command not found").
  COMMANDS.vector.about   = 'status of my order';
  COMMANDS.vector.active  = true;
  COMMANDS.devices.about  = 'old iOS 6 hardware';
  COMMANDS.devices.active = true;
  COMMANDS.hints.about    = 'hints about the other commands';
  COMMANDS.hints.active  = true;

  // -----------------------------------------------------------
  // Rendering helpers
  // -----------------------------------------------------------
  const log = document.getElementById('log');
  const screen = document.getElementById('screen');

  function lineEl(text){
    const div = document.createElement('div');
    let cls = 'line';
    let content = text;
    const m = /^::([\w-]+)::([\s\S]*)$/.exec(text);
    if (m){ cls += ' ' + m[1]; content = m[2]; }
    div.className = cls;
    div.textContent = content;
    return div;
  }

  function print(text){
    log.appendChild(lineEl(text));
    screen.scrollTop = screen.scrollHeight;
  }

  function printLines(lines){
    lines.forEach(print);
  }

  function printCommandEcho(cmdText){
    const row = document.createElement('div');
    row.className = 'row';
    const p = document.createElement('span');
    p.className = 'prompt';
    p.textContent = PROMPT_USER + ':~$';
    const t = document.createElement('span');
    t.textContent = ' ' + cmdText;
    row.appendChild(p);
    row.appendChild(t);
    log.appendChild(row);
  }

  // -----------------------------------------------------------
  // Boot sequence
  // -----------------------------------------------------------
  const BOOT_LINES = [
    '::dim::R632-SH boot sequence initiated...',
    '::dim::checking servos ......... OK',
    '::dim::checking antenna ........ OK',
    '::dim::loading personality ..... OK',
    '::dim::uplink to guzzoni ........ skipped',
    '',
  ];

  // -----------------------------------------------------------
  // Boot chime: classic Apple II startup beep, embedded as a data
  // URI so no external audio file is needed. Plays once, right
  // before any boot text starts appearing on screen. Respects the
  // global sound toggle (SOUND_ICONS/getSound above).

  // Browsers block audio autoplay until the user has interacted
  // with the page at least once, so this first attempt (fired on
  // page load, before any click/keypress) can get silently
  // blocked. bootSoundPlayed tracks whether it actually got
  // through; if it didn't, the listeners further down retry it on
  // the user's very first click/keypress/tap, so it still plays

  // -----------------------------------------------------------
  // -----------------------------------------------------------
  // Typing sound: real sampled keystrokes -- IBM Model M clicks
  // recorded for the open-source "bucklespring" keyboard sound
  // project (Ico Doornekamp, GPLv2), trimmed down and embedded as
  // data URIs (no external audio files needed).
  //
  // A real keyboard doesn't sound identical on every key, so
  // instead of one repeating sample this pulls from a pool of
  // distinct recorded keystrokes and picks one at random each

  // -----------------------------------------------------------
  const BOOT_SOUND_VOLUME = 0.42;

  let bootSoundPlayed = false;
  function tryPlayBootSound(){
    if (bootSoundPlayed) return;
    if (!window.robot632SoundOn || !window.robot632SoundOn()) return;
    try {
      const audio = new Audio(BOOT_SOUND_SRC);
      audio.volume = BOOT_SOUND_VOLUME;
      const p = audio.play();
      if (p && p.then){
        p.then(() => { bootSoundPlayed = true; })
         .catch(() => { /* still blocked -- will retry on next interaction */ });
      } else {
        bootSoundPlayed = true;
      }
    } catch (e) { /* ignore */ }
  }

  function playBootSound(){
    tryPlayBootSound();
    return sleep(180); // roughly the chime's length, so text waits for it
  }

  ['pointerdown', 'keydown', 'touchstart'].forEach(evt => {
    document.addEventListener(evt, () => {
      if (!bootSoundPlayed) tryPlayBootSound();
    });
  });

  async function boot(){
    await playBootSound();
    for (const l of BOOT_LINES){
      print(l);
      await sleep(120);
    }
    BANNER.split('\n').forEach(l => print('::banner-line::' + l));
    print('');
    print("type hints for command hints.");
    print('');
    document.getElementById('inputLine').style.display = 'flex';
    document.getElementById('cmdInput').focus();
  }

  function sleep(ms){ return new Promise(r => setTimeout(r, ms)); }

  // -----------------------------------------------------------
  // Input handling
  // -----------------------------------------------------------
  const input = document.getElementById('cmdInput');
  const history = [];
  let historyIndex = -1;

  function runCommand(raw){
    const trimmed = raw.trim();
    if (!trimmed){ return; }
    printCommandEcho(raw);

    history.push(raw);
    historyIndex = history.length;

    const [cmd, ...rest] = trimmed.split(/\s+/);
    const arg = trimmed.slice(cmd.length).trim();
    const handler = COMMANDS[cmd.toLowerCase()];

    if (!handler || handler.active === false){
      print(`::err::command not found: ${cmd} (try 'hints')`);
      return;
    }
    const result = handler(arg);
    if (typeof result === 'string') print(result);
    else if (Array.isArray(result)) printLines(result);
  }

  // Mobile virtual keyboards are unreliable for sound purposes on
  // keydown: many on-screen keyboards go through an IME, so e.key
  // comes back as "Unidentified" for basically every key (that's why
  // typing sound never fired -- the old code required e.key.length===1)
  // and e.repeat is never set true while a key is held (that's why
  // holding Backspace spammed overlapping sounds).
  //
  // Fix: track the actual physical press/release (down/up), which
  // *does* fire reliably even when e.key is "Unidentified" -- we only
  // need to know a key is down, not which one. One sound plays per
  // press; while that key stays held, no more sounds fire (matching
  // native OS key-repeat behavior on desktop); releasing and pressing
  // again (however fast) plays a fresh sound each time.
  let keyHeld = false;
  let soundFiredForHold = false;

  function maybePlayTypingSound(key){
    if (soundFiredForHold) return; // already sounded for this held press
    soundFiredForHold = true;
    playTypingSound(key);
  }

  function onPressStart(){
    keyHeld = true;
    // don't reset soundFiredForHold here -- it's reset on release,
    // and starts false so the very first press of the session plays.
  }
  function onPressEnd(){
    keyHeld = false;
    soundFiredForHold = false;
  }

  input.addEventListener('keydown', (e) => {
    if (!keyHeld) onPressStart();
  });
  input.addEventListener('keyup', onPressEnd);
  input.addEventListener('blur', onPressEnd); // mobile can lose focus without a keyup

  input.addEventListener('input', (e) => {
    const type = e.inputType || '';
    if (type.startsWith('delete')){
      maybePlayTypingSound('Backspace');
    } else if (type.startsWith('insert')){
      // e.data holds the actual character when available (typed key,
      // pasted text, autocomplete, etc.) -- only ' ' gets special
      // treatment, everything else uses the generic click sound.
      maybePlayTypingSound(e.data === ' ' ? ' ' : 'a');
    }
  });

  input.addEventListener('keydown', (e) => {
    // Enter doesn't change the input's value, so it never fires an
    // 'input' event -- trigger its sound here instead, through the
    // same press/release-gated helper so holding Enter can't spam it.
    if (e.key === 'Enter'){
      maybePlayTypingSound('Enter');
    }

    if (e.key === 'Enter'){
      const val = input.value;
      input.value = '';
      runCommand(val);
    } else if (e.key === 'ArrowUp'){
      e.preventDefault();
      if (history.length){
        historyIndex = Math.max(0, historyIndex - 1);
        input.value = history[historyIndex] || '';
      }
    } else if (e.key === 'ArrowDown'){
      e.preventDefault();
      if (history.length){
        historyIndex = Math.min(history.length, historyIndex + 1);
        input.value = history[historyIndex] || '';
      }
    } else if (e.key === 'Escape'){
      window.location.href = 'index.html';
    }
  });

  screen.addEventListener('click', () => input.focus());

  // -----------------------------------------------------------
  // Pre-boot splash -- the machine sits idle showing "ROBOT II
  // COMPUTER" / "PRESS ENTER TO BOOT" until the user presses
  // Enter (or taps/clicks the splash). That keypress/tap is also
  // exactly the kind of user gesture browsers require before
  // they'll allow audio playback, so the boot chime plays
  // reliably right after it.
  // -----------------------------------------------------------
  const splashEl = document.getElementById('splash');

  function startBoot(){
    if (splashEl) splashEl.classList.add('hidden');
    boot();
  }

  if (splashEl){
    function onSplashKey(e){
      if (e.key !== 'Enter') return;
      document.removeEventListener('keydown', onSplashKey);
      startBoot();
    }
    function onSplashClick(){
      document.removeEventListener('keydown', onSplashKey);
      startBoot();
    }
    document.addEventListener('keydown', onSplashKey);
    splashEl.addEventListener('click', onSplashClick);
  } else {
    boot();
  }
</script>

</body>
</html>
