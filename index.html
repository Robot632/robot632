    // -----------------------------------------------------------
    // Fonts: a shared "font position" advances by one step every
    // cycle, and the whole title updates letter-by-letter in a
    // quick cascade (not all at once) before pausing.
    //
    // Clicking a letter bumps that letter's own offset forward by
    // one step, so it stays permanently that many fonts ahead of
    // the rest of the group on every future cascade -- it doesn't
    // resync with everyone else.
    // -----------------------------------------------------------
    const FONTS = [
      { family: "'Rubik', sans-serif",         weight: 700, tilt: 0  },
      { family: "'Caveat', cursive",           weight: 700, tilt: -4 },
      { family: "'Bangers', cursive",          weight: 400, tilt: 3  },
      { family: "'Permanent Marker', cursive", weight: 400, tilt: -2 },
      { family: "'Kalam', cursive",            weight: 700, tilt: 5  },
      { family: "'Chewy', cursive",            weight: 400, tilt: -3 },
      { family: "'Nunito', sans-serif",        weight: 800, tilt: 2  }
    ];

    const letters = Array.from(document.querySelectorAll('.wordmark span'));
    const letterOffsets = letters.map(() => 0);
    let fontIndex = 0;

    function applyFont(letter, i){
      const font = FONTS[(fontIndex + letterOffsets[i]) % FONTS.length];
      letter.style.fontFamily = font.family;
      letter.style.fontWeight = font.weight;
      letter.style.transform = `rotate(${font.tilt}deg)`;
    }

    function cascadeFonts(){
      fontIndex = (fontIndex + 1) % FONTS.length;
      let i = 0;

      function nextLetter(){
        if (i < letters.length){
          applyFont(letters[i], i);
          i++;
          setTimeout(nextLetter, 40); // 40ms stagger between letters
        } else {
          setTimeout(cascadeFonts, 2000); // pause before the next cascade
        }
      }
      nextLetter();
    }

    // Quick shrink then a springy ease-out back to full size
    function bounceLetter(letter){
      letter.animate(
        [
          { transform: `${letter.style.transform} scale(1)`, offset: 0 },
          { transform: `${letter.style.transform} scale(0.75)`, offset: 0.08 },
          { transform: `${letter.style.transform} scale(1)`, offset: 1 }
        ],
        { duration: 500, easing: 'cubic-bezier(0.16, 1, 0.3, 1)', fill: 'none' }
      );
    }

    // -----------------------------------------------------------
    // Feature: letters are draggable -- pick one up and it follows
    // the pointer, let go and it springs back to place. A drag is
    // distinguished from a plain click by movement distance, so
    // the existing click-to-cycle-font behavior still works for a
    // letter that's just tapped rather than dragged.
    // -----------------------------------------------------------
    const DRAG_THRESHOLD = 4; // px of movement before it counts as a drag
    const DRAG_SAFE_MARGIN = 4; // px kept clear of the panel's true edge
    const panelEl = document.querySelector('.panel');
    let activeLetterDrags = 0; // tracks concurrent drags (e.g. multi-touch)

    letters.forEach((letter, i) => {
      letter.style.touchAction = 'none';
      let dragging = false;
      let dragged = false;
      let startX = 0, startY = 0;
      let minDx = 0, maxDx = 0, minDy = 0, maxDy = 0;

      letter.addEventListener('pointerdown', (e) => {
        e.preventDefault(); // stop the browser starting a text/image drag or selection
        dragging = true;
        dragged = false;
        startX = e.clientX;
        startY = e.clientY;
        letter.setPointerCapture(e.pointerId);
        letter.style.zIndex = 10;

        // Belt-and-suspenders against a scrollbar appearing mid-drag:
        // lock .panel's own scrolling off entirely while a letter is
        // being dragged (restored the moment every drag has ended),
        // regardless of what would have triggered the overflow.
        activeLetterDrags++;
        panelEl.style.overflow = 'hidden';

        // Also work out how far this letter can move in each
        // direction before it would cross the panel's real edge, so
        // it visually never flies past the panel border either.
        const letterRect = letter.getBoundingClientRect();
        const panelRect = panelEl.getBoundingClientRect();
        minDx = panelRect.left + DRAG_SAFE_MARGIN - letterRect.left;
        maxDx = panelRect.right - DRAG_SAFE_MARGIN - letterRect.right;
        minDy = panelRect.top + DRAG_SAFE_MARGIN - letterRect.top;
        maxDy = panelRect.bottom - DRAG_SAFE_MARGIN - letterRect.bottom;
      });

      letter.addEventListener('pointermove', (e) => {
        if (!dragging) return;
        let dx = e.clientX - startX;
        let dy = e.clientY - startY;
        if (!dragged && (Math.abs(dx) > DRAG_THRESHOLD || Math.abs(dy) > DRAG_THRESHOLD)){
          dragged = true;
        }
        if (dragged){
          dx = Math.min(Math.max(dx, minDx), maxDx);
          dy = Math.min(Math.max(dy, minDy), maxDy);
          letter.style.translate = `${dx}px ${dy}px`;
        }
      });

      function releaseLetter(e){
        if (!dragging) return;
        dragging = false;
        letter.style.zIndex = '';
        activeLetterDrags = Math.max(0, activeLetterDrags - 1);
        if (activeLetterDrags === 0) panelEl.style.overflow = '';
        if (dragged){
          const current = letter.style.translate || '0px 0px';
          letter.style.translate = '0px 0px';
          letter.animate(
            [{ translate: current }, { translate: '0px 0px' }],
            { duration: 480, easing: 'cubic-bezier(0.34, 1.56, 0.64, 1)' }
          );
        }
      }

      letter.addEventListener('pointerup', releaseLetter);
      letter.addEventListener('pointercancel', releaseLetter);

      letter.addEventListener('click', () => {
        if (dragged) { dragged = false; return; } // a drag just ended, don't also cycle the font
        letterOffsets[i] = (letterOffsets[i] + 1) % FONTS.length;
        applyFont(letter, i);
        bounceLetter(letter);
      });
    });

    document.fonts.ready.then(() => {
      letters.forEach((letter, i) => applyFont(letter, i)); // uniform on first load
      cascadeFonts();
    });

    // -----------------------------------------------------------
    // Tagline: pick a new line from the list every visit, cycling
    // through the whole array before any line repeats.
    // -----------------------------------------------------------
    const TAGLINES = [
      "beep boop, currently loading personality...",
      "99% battery, 100% vibes",
      "not a bot, just built like one",
      "made of metal, powered by snacks",
      "error 404: normal robot not found",
      "still figuring out what buttons do what"
    ];

    (function rotateTagline(){
      const STORAGE_KEY = 'robot632_tagline_index';
      let index = parseInt(localStorage.getItem(STORAGE_KEY), 10);
      if (isNaN(index)) index = -1;
      index = (index + 1) % TAGLINES.length;
      localStorage.setItem(STORAGE_KEY, index);

      const el = document.getElementById('tagline');
      if (el) el.textContent = TAGLINES[index];
    })();

    // -----------------------------------------------------------
    // Feature: visit counter -- "you've powered me on X times".
    // Simple localStorage tally, one increment per page load.
    // -----------------------------------------------------------
    (function trackVisits(){
      const VISIT_KEY = 'robot632_visits';
      let count = parseInt(localStorage.getItem(VISIT_KEY), 10);
      if (isNaN(count)) count = 0;
      count += 1;
      localStorage.setItem(VISIT_KEY, count);

      const el = document.getElementById('visit-counter');
      if (el) el.textContent = `powered on ${count} time${count === 1 ? '' : 's'}`;
    })();

    // -----------------------------------------------------------
    // Feature: idle animations. After a short idle stretch the
    // main icon's eyes blink every few seconds. After a longer
    // idle stretch, a tiny bouncing face joins in, DVD-screensaver
    // style, until any interaction stops it.
    // -----------------------------------------------------------
    const IDLE_BLINK_DELAY = 4000;   // ms of inactivity before blinking starts
    const IDLE_DVD_DELAY   = 26000;  // ms of inactivity before the DVD bounce starts

    const eyes = document.querySelectorAll('.bot-icon .eye');
    const dvdBot = document.getElementById('dvd-bot');

    let idleBlinkTimer = null;
    let blinkLoopTimer = null;
    let idleDvdTimer = null;
    let dvdRAF = null;

    function blinkEyes(){
      // a sleeping bot (High graphics, at night) keeps its eyes shut
      if (getGraphics() === 'high' && document.documentElement.dataset.phase === 'night'){
        blinkLoopTimer = setTimeout(blinkEyes, 3000);
        return;
      }
      eyes.forEach(eye => {
        eye.classList.remove('blinking');
        void eye.offsetWidth; // restart the animation each time
        eye.classList.add('blinking');
      });
      blinkLoopTimer = setTimeout(blinkEyes, 2200 + Math.random() * 2600);
    }

    function startDvdBounce(){
      if (!dvdBot) return;
      const panel = document.querySelector('.panel');
      const DVD_W = 26;   // body width
      const DVD_H = 41;   // body height + legs, so the legs stay on-panel too
      const MARGIN = 16;  // keeps the wings/legs' visual overhang from ever
                          // crossing the panel's real edge and forcing a scrollbar

      let bounds = panel.getBoundingClientRect();
      let x = MARGIN + Math.random() * Math.max(0, bounds.width - DVD_W - MARGIN * 2);
      let y = MARGIN + Math.random() * Math.max(0, bounds.height - DVD_H - MARGIN * 2);
      let vx = (Math.random() < 0.5 ? -1 : 1) * 1.4;
      let vy = (Math.random() < 0.5 ? -1 : 1) * 1.4;

      dvdBot.style.display = 'flex';
      dvdBot.style.scale = '1';

      function squish(){
        dvdBot.animate(
          [
            { scale: '1 1' },
            { scale: '1.25 0.8' },
            { scale: '1 1' }
          ],
          { duration: 260, easing: 'cubic-bezier(0.34, 1.56, 0.64, 1)' }
        );
      }

      function step(){
        bounds = panel.getBoundingClientRect();
        const minX = MARGIN;
        const minY = MARGIN;
        const maxX = Math.max(minX, bounds.width - DVD_W - MARGIN);
        const maxY = Math.max(minY, bounds.height - DVD_H - MARGIN);
        x += vx;
        y += vy;
        let bounced = false;
        if (x <= minX || x >= maxX){ vx *= -1; x = Math.min(Math.max(x, minX), maxX); bounced = true; }
        if (y <= minY || y >= maxY){ vy *= -1; y = Math.min(Math.max(y, minY), maxY); bounced = true; }
        if (bounced) squish();
        // slight lean in the direction of travel, purely cosmetic
        dvdBot.style.rotate = `${vx * 4}deg`;
        dvdBot.style.translate = `${x}px ${y}px`;
        dvdRAF = requestAnimationFrame(step);
      }
      dvdRAF = requestAnimationFrame(step);
    }

    function stopDvdBounce(){
      if (dvdRAF) cancelAnimationFrame(dvdRAF);
      dvdRAF = null;
      if (dvdBot) dvdBot.style.display = 'none';
    }

    function resetIdle(){
      clearTimeout(idleBlinkTimer);
      clearTimeout(blinkLoopTimer);
      clearTimeout(idleDvdTimer);
      stopDvdBounce();
      idleBlinkTimer = setTimeout(blinkEyes, IDLE_BLINK_DELAY);
      idleDvdTimer = setTimeout(startDvdBounce, IDLE_DVD_DELAY);
    }

    ['pointerdown', 'pointermove', 'keydown', 'wheel', 'touchstart'].forEach(evt =>
      window.addEventListener(evt, resetIdle, { passive: true })
    );
    resetIdle();

    // -----------------------------------------------------------
    // Optional little synth blips for High graphics (pet chirps).
    // Same rule as the click sound: silent when sound is off.
    // -----------------------------------------------------------
    let blipCtx = null;
    function blip(freq, duration = 0.08, type = 'sine', volume = 0.05){
      if (!window.robot632SoundOn()) return;
      try{
        blipCtx = blipCtx || new (window.AudioContext || window.webkitAudioContext)();
        const osc = blipCtx.createOscillator();
        const gain = blipCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, blipCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(freq * 1.5, blipCtx.currentTime + duration);
        gain.gain.setValueAtTime(volume, blipCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, blipCtx.currentTime + duration);
        osc.connect(gain).connect(blipCtx.destination);
        osc.start();
        osc.stop(blipCtx.currentTime + duration);
      } catch (e){ /* no Web Audio, no blips */ }
    }

    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    // -----------------------------------------------------------
    // Pip: a tiny tracked robot that rolls along the bottom of the
    // panel. Its fuel drains slowly in real time (even while the
    // page is closed -- it's worked out from a saved timestamp), so
    // coming back after a long time means a hungry Pip. Tap Pip to
    // see the fuel meter and drop it a bolt; it rolls over and
    // eats it. At night (see HighGfx) it falls asleep where it is.
    //
    // Pip also keeps count of every bolt it has ever eaten and
    // dresses up as it goes (TIERS): a cap at 10, a new paint job at
    // 50, and solid gold with a crown at 100.
    // -----------------------------------------------------------
    const Pet = (() => {
      const KEY = 'robot632_pet';
      const DECAY_MS = 6 * 60 * 1000; // one fuel point every 6 minutes
      const PET_W = 40;
      const EDGE = 26;                // stays clear of the corner bolts
      const BOLT_FUEL = 25;
      const TIERS = [
        { at: 0,   name: 'rookie' },
        { at: 10,  name: 'capped',  trophy: 'pip_10' },
        { at: 50,  name: 'chrome',  trophy: 'pip_50' },
        { at: 100, name: 'royal',   trophy: 'pip_100' }
      ];

      let el = null, bubble = null, meterFill = null, feedBtn = null, think = null;
      let raf = null, saveTimer = null, lastFrame = 0;
      let x = EDGE, dir = 1, target = null, pauseUntil = 0;
      let fuel = 70;
      let eaten = 0;
      let snack = null; // { el, x, landed }

      function tier(){
        let t = 0;
        TIERS.forEach((x, i) => { if (eaten >= x.at) t = i; });
        return t;
      }

      function load(){
        try{
          const saved = JSON.parse(localStorage.getItem(KEY));
          if (saved && typeof saved.fuel === 'number' && typeof saved.t === 'number'){
            fuel = Math.max(0, Math.min(100, saved.fuel - (Date.now() - saved.t) / DECAY_MS));
            eaten = typeof saved.eaten === 'number' ? saved.eaten : 0;
            return;
          }
        } catch (e){}
        fuel = 70;
        eaten = 0;
      }

      function save(){
        localStorage.setItem(KEY, JSON.stringify({ fuel: Math.round(fuel * 10) / 10, t: Date.now(), eaten }));
      }

      function mood(){ return fuel >= 60 ? 'happy' : fuel >= 25 ? 'ok' : 'hungry'; }
      function asleep(){ return document.documentElement.dataset.phase === 'night' && !snack; }

      function bounds(){
        return { min: EDGE, max: Math.max(EDGE, panelEl.clientWidth - EDGE - PET_W) };
      }

      function build(){
        el = document.createElement('button');
        el.type = 'button';
        el.className = 'pet';
        el.setAttribute('aria-label', 'Pip, the pet robot. Tap to check on it.');
        el.innerHTML = `
          <span class="pet-inner" aria-hidden="true">
            <span class="pet-neck"></span>
            <span class="pet-hat"></span>
            <span class="pet-eyes"><span class="pet-eye"></span><span class="pet-eye"></span></span>
            <span class="pet-body"></span>
            <span class="pet-tread"></span>
          </span>
          <span class="pet-think" aria-hidden="true"></span>
        `;
        think = el.querySelector('.pet-think');

        bubble = document.createElement('div');
        bubble.className = 'pet-bubble';
        bubble.hidden = true;
        bubble.innerHTML = `
          <div><span>Pip</span> <span class="pet-status" style="opacity:0.7"></span></div>
          <div class="pet-level"></div>
          <div class="pet-meter" role="meter" aria-label="Pip's fuel" aria-valuemin="0" aria-valuemax="100"><div class="pet-meter-fill"></div></div>
          <button type="button" class="pet-feed">Drop a bolt 🔩</button>
        `;
        meterFill = bubble.querySelector('.pet-meter-fill');
        feedBtn = bubble.querySelector('.pet-feed');

        el.addEventListener('click', () => {
          bubble.hidden = !bubble.hidden;
          updateBubble();
          hearts(2);
          blip(asleep() ? 300 : 700, 0.09);
          if (!asleep()) pauseUntil = performance.now() + 1500; // stops to look at you
        });
        feedBtn.addEventListener('click', dropSnack);

        panelEl.appendChild(el);
        panelEl.appendChild(bubble);
      }

      function updateBubble(){
        if (!bubble || bubble.hidden) return;
        const m = mood();
        const status = asleep() ? 'is asleep' : m === 'happy' ? 'is happy' : m === 'ok' ? 'is fine' : 'is hungry!';
        bubble.querySelector('.pet-status').textContent = status;
        meterFill.style.width = `${Math.round(fuel)}%`;
        bubble.querySelector('.pet-meter').setAttribute('aria-valuenow', Math.round(fuel));
        const t = tier();
        const next = TIERS[t + 1];
        bubble.querySelector('.pet-level').textContent =
          `${eaten} bolt${eaten === 1 ? '' : 's'} eaten` + (next ? ` · new look at ${next.at}` : ' · max level 👑');
        feedBtn.disabled = !!snack || fuel >= 99.5;
        feedBtn.textContent = fuel >= 99.5 ? 'Full! 🔋' : 'Drop a bolt 🔩';
      }

      function placeBubble(){
        if (bubble.hidden) return;
        const w = panelEl.clientWidth;
        const left = Math.min(Math.max(x + PET_W / 2 - 80, 10), w - 170);
        bubble.style.left = `${left}px`;
      }

      function hearts(count){
        if (reduceMotion) return;
        for (let i = 0; i < count; i++){
          const h = document.createElement('span');
          h.className = 'pet-heart';
          h.textContent = '♥';
          h.style.left = `${x + 12 + Math.random() * 16}px`;
          panelEl.appendChild(h);
          h.animate(
            [
              { translate: '0 0', opacity: 1 },
              { translate: `${(Math.random() - 0.5) * 30}px -38px`, opacity: 0 }
            ],
            { duration: 900 + Math.random() * 300, delay: i * 120, easing: 'ease-out', fill: 'both' }
          ).onfinish = () => h.remove();
        }
      }

      function dropSnack(e){
        e.stopPropagation();
        if (snack) return;
        const b = bounds();
        const sx = b.min + PET_W / 2 + Math.random() * (b.max - b.min);
        const s = document.createElement('span');
        s.className = 'pet-bolt';
        s.style.left = `${sx}px`;
        panelEl.appendChild(s);
        snack = { el: s, x: sx, landed: false };
        // falls from near the top of the panel down to Pip's floor
        const fall = Math.max(60, panelEl.clientHeight - 90);
        const anim = s.animate(
          [
            { translate: `0 -${fall}px`, rotate: '0deg' },
            { translate: '0 0', rotate: '540deg' }
          ],
          { duration: reduceMotion ? 1 : 900, easing: 'cubic-bezier(0.5, 0, 1, 1)', fill: 'forwards' }
        );
        anim.onfinish = () => {
          if (!snack) return;
          snack.landed = true;
          target = null;
          pauseUntil = 0;
          blip(220, 0.05, 'triangle', 0.04);
        };
        updateBubble();
      }

      function eat(){
        snack.el.remove();
        snack = null;
        fuel = Math.min(100, fuel + BOLT_FUEL);
        const before = tier();
        eaten += 1;
        save();
        const after = tier();
        el.dataset.tier = after;
        if (window.R632Ach){
          R632Ach.unlock('pip_fed');
          if (TIERS[after].trophy) R632Ach.unlock(TIERS[after].trophy);
        }
        hearts(after > before ? 10 : 4);
        blip(520, 0.07, 'square', 0.03);
        setTimeout(() => blip(780, 0.09, 'square', 0.03), 90);
        if (!reduceMotion){
          el.animate(
            [{ translate: `${x}px 0` }, { translate: `${x}px -10px` }, { translate: `${x}px 0` }],
            { duration: 380, easing: 'ease-out' }
          );
        }
        pauseUntil = performance.now() + 1600;
        updateBubble();
      }

      function tick(now){
        const dt = Math.min(50, now - (lastFrame || now));
        lastFrame = now;
        fuel = Math.max(0, fuel - dt / DECAY_MS);

        const b = bounds();
        const m = mood();
        const sleeping = asleep();
        let moving = false;

        if (!sleeping && now >= pauseUntil){
          if (snack && snack.landed) target = snack.x - PET_W / 2;
          if (target === null && !snack) target = b.min + Math.random() * (b.max - b.min);
          if (target !== null){
            target = Math.min(Math.max(target, b.min), b.max);
            const speed = (m === 'happy' ? 0.07 : m === 'ok' ? 0.05 : 0.028) * dt;
            const d = target - x;
            if (Math.abs(d) <= speed){
              x = target;
              target = null;
              if (snack && snack.landed) eat();
              else pauseUntil = now + 1200 + Math.random() * 3800;
            } else {
              dir = Math.sign(d);
              x += dir * speed;
              moving = true;
            }
          }
        }
        x = Math.min(Math.max(x, b.min), b.max);

        el.style.translate = `${x}px 0`;
        el.style.setProperty('--dir', dir);
        el.classList.toggle('walking', moving);
        el.dataset.mood = m;
        el.dataset.asleep = sleeping ? 'true' : 'false';
        think.textContent = sleeping ? 'z z z' : '🔩?';
        placeBubble();
        if (Math.random() < 0.02) updateBubble(); // cheap, a few times a second

        raf = requestAnimationFrame(tick);
      }

      function onPagehide(){ save(); }

      return {
        start(){
          if (el) return;
          load();
          build();
          el.dataset.tier = tier();
          const b = bounds();
          x = b.min + Math.random() * (b.max - b.min);
          lastFrame = 0;
          raf = requestAnimationFrame(tick);
          saveTimer = setInterval(save, 30000);
          window.addEventListener('pagehide', onPagehide);
        },
        stop(){
          if (!el) return;
          save();
          cancelAnimationFrame(raf);
          clearInterval(saveTimer);
          window.removeEventListener('pagehide', onPagehide);
          if (snack){ snack.el.remove(); snack = null; }
          el.remove();
          bubble.remove();
          el = bubble = null;
          target = null;
        },
        closeBubble(e){
          if (bubble && !bubble.hidden && !bubble.contains(e.target) && !el.contains(e.target)) bubble.hidden = true;
        }
      };
    })();

    document.addEventListener('pointerdown', (e) => Pet.closeBubble(e));

    // -----------------------------------------------------------
    // HighGfx: the robot's day. The visitor's local hour picks a
    // phase -- night (22-6), morning (6-10), day (10-18), evening
    // (18-22) -- which tints the sky (CSS, via data-phase on
    // <html>), changes what the bot is doing (asleep with Zzz,
    // coffee mug, warm eyes), and picks the particles drawn on
    // #fx-canvas: twinkling stars + the odd shooting star, rising
    // morning bubbles, drifting day dust, or evening fireflies.
    // Also makes the bot's eyes follow the pointer while awake.
    //
    // Holidays (HOLIDAYS below) take over the particles and dress
    // the bot up (data-holiday on <html>, styled in CSS). Preview
    // one any day with ?holiday=halloween (or christmas, newyear,
    // valentine, martisor) in the URL.
    // -----------------------------------------------------------
    const HOLIDAYS = [
      { id: 'christmas', label: '🎄 merry christmas from robot632!', from: [12, 20], to: [12, 30], fx: 'snow' },
      { id: 'newyear',   label: '🎆 happy new year!',                from: [12, 31], to: [1, 2],   fx: 'confetti' },
      { id: 'valentine', label: "💖 happy valentine's day",          from: [2, 14],  to: [2, 14],  fx: 'hearts' },
      { id: 'martisor',  label: '🌸 happy mărțișor!',                from: [3, 1],   to: [3, 7],   fx: 'petals' },
      { id: 'halloween', label: '🎃 happy halloween!',               from: [10, 25], to: [10, 31], fx: 'embers' }
    ];

    function holidayFor(date){
      const preview = new URLSearchParams(location.search).get('holiday');
      if (preview){
        const h = HOLIDAYS.find(x => x.id === preview);
        if (h) return h;
      }
      const m = date.getMonth() + 1, d = date.getDate();
      const v = m * 100 + d;
      return HOLIDAYS.find(h => {
        const a = h.from[0] * 100 + h.from[1], b = h.to[0] * 100 + h.to[1];
        return a <= b ? (v >= a && v <= b) : (v >= a || v <= b); // ranges may wrap past new year
      }) || null;
    }

    const HighGfx = (() => {
      const canvas = document.getElementById('fx-canvas');
      const ctx = canvas.getContext('2d');
      const phaseLabel = document.getElementById('phase-label');
      const visor = document.querySelector('.bot-icon .visor');

      const PHASES = {
        night:   { label: '🌙 night: robot is recharging, shh', count: 80 },
        morning: { label: '☕ morning: robot is having its oil coffee', count: 26 },
        day:     { label: '☀️ day: robot is fully operational', count: 30 },
        evening: { label: '🌇 evening: robot is winding down', count: 22 }
      };
      const FX_COUNTS = { snow: 70, confetti: 60, hearts: 22, petals: 30, embers: 40 };
      const CONFETTI = ['#ff6fc1', '#2f6fed', '#ff8a3d', '#2fb84f', '#ffd65a', '#4be9ff'];

      let running = false;
      let phase = null;
      let holiday = null;
      let kind = null; // what particles are drawn: a phase name or a holiday fx
      let particles = [];
      let shooting = null;
      let nextShootAt = 0;
      let raf = null, phaseTimer = null;
      let W = 0, H = 0;

      function phaseFor(hour){
        if (hour >= 22 || hour < 6) return 'night';
        if (hour < 10) return 'morning';
        if (hour < 18) return 'day';
        return 'evening';
      }

      function resize(){
        const dpr = Math.min(2, window.devicePixelRatio || 1);
        W = panelEl.clientWidth;
        H = panelEl.clientHeight;
        canvas.width = Math.round(W * dpr);
        canvas.height = Math.round(H * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }

      const panelObserver = new ResizeObserver(() => {
        resize();
        if (reduceMotion) draw(0);
      });

      function makeParticles(){
        const base = FX_COUNTS[kind] || PHASES[phase].count;
        const n = Math.round(base * (getGraphics() === 'ultra' ? 1.8 : 1));
        particles = Array.from({ length: n }, () => {
          const p = {
            x: Math.random() * W,
            y: Math.random() * H,
            r: kind === 'night' ? 0.6 + Math.random() * 1.4 : 1.5 + Math.random() * 3,
            vx: (Math.random() - 0.5) * 0.2,
            vy: (Math.random() - 0.5) * 0.15,
            t: Math.random() * Math.PI * 2,
            s: 0.6 + Math.random() * 1.2,
            spin: (Math.random() - 0.5) * 0.15,
            color: CONFETTI[Math.floor(Math.random() * CONFETTI.length)]
          };
          if (kind === 'morning') p.vy = -(0.15 + Math.random() * 0.3);
          if (kind === 'snow') p.vy = 0.3 + Math.random() * 0.6;
          if (kind === 'confetti') p.vy = 0.6 + Math.random() * 0.9;
          if (kind === 'petals') p.vy = 0.25 + Math.random() * 0.4;
          if (kind === 'hearts' || kind === 'embers') p.vy = -(0.25 + Math.random() * 0.5);
          return p;
        });
      }

      function updatePhase(){
        const now = new Date();
        const p = phaseFor(now.getHours());
        const h = holidayFor(now);
        if (p === phase && h === holiday) return;
        phase = p;
        holiday = h;
        kind = h ? h.fx : p;
        const root = document.documentElement;
        root.dataset.phase = p;
        if (h){
          root.dataset.holiday = h.id;
          if (window.R632Ach) R632Ach.unlock('holiday');
        } else {
          delete root.dataset.holiday;
        }
        phaseLabel.textContent = h ? h.label : PHASES[p].label;
        if (p === 'night') eyes.forEach(eye => { eye.style.translate = ''; });
        makeParticles();
        if (reduceMotion) draw(0);
      }

      function dot(x, y, r, color, glow){
        if (glow){
          ctx.globalAlpha *= 0.25;
          ctx.beginPath();
          ctx.arc(x, y, r * 3, 0, Math.PI * 2);
          ctx.fillStyle = color;
          ctx.fill();
          ctx.globalAlpha *= 4;
        }
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.fillStyle = color;
        ctx.fill();
      }

      function move(p){
        p.t += 0.02 * p.s;
        if (kind === 'evening'){
          p.x += Math.cos(p.t * 0.7) * 0.4 + p.vx;
          p.y += Math.sin(p.t * 0.9) * 0.3 + p.vy;
        } else if (kind !== 'night'){
          // everything else drifts along its own vy with a little sway
          p.x += p.vx + Math.sin(p.t) * (kind === 'snow' || kind === 'petals' ? 0.4 : 0.15);
          p.y += p.vy;
        }
        if (p.y < -10) p.y = H + 10;
        if (p.y > H + 10) p.y = -10;
        if (p.x < -10) p.x = W + 10;
        if (p.x > W + 10) p.x = -10;
      }

      function drawParticle(p, light){
        switch (kind){
          case 'night':
            ctx.globalAlpha = 0.3 + 0.7 * Math.abs(Math.sin(p.t));
            dot(p.x, p.y, p.r, light ? '#3a4a9a' : '#ffffff', p.r > 1.6);
            break;
          case 'morning':
            ctx.globalAlpha = 0.35;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.r * 1.6, 0, Math.PI * 2);
            ctx.strokeStyle = light ? 'rgba(200,110,40,0.8)' : 'rgba(255,236,200,0.9)';
            ctx.lineWidth = 1.2;
            ctx.stroke();
            break;
          case 'day':
            ctx.globalAlpha = 0.25 + 0.15 * Math.sin(p.t);
            dot(p.x, p.y, p.r * 0.7, light ? 'rgba(0,90,90,0.7)' : '#ffffff', false);
            break;
          case 'evening':
            ctx.globalAlpha = 0.25 + 0.75 * Math.max(0, Math.sin(p.t * 1.3));
            dot(p.x, p.y, p.r * 0.8, light ? '#e08a10' : '#ffc65a', true);
            break;
          case 'snow':
            ctx.globalAlpha = 0.85;
            dot(p.x, p.y, p.r * 0.8, light ? '#8fb3c9' : '#ffffff', false);
            break;
          case 'confetti':
          case 'petals':
            ctx.save();
            ctx.translate(p.x, p.y);
            ctx.rotate(p.t * 3 * p.spin * 10);
            ctx.globalAlpha = 0.9;
            ctx.fillStyle = kind === 'petals' ? (p.s > 1.2 ? '#e2242b' : (light ? '#f3b6c8' : '#ffffff')) : p.color;
            if (kind === 'petals'){
              ctx.beginPath();
              ctx.ellipse(0, 0, p.r * 1.2, p.r * 0.6, 0, 0, Math.PI * 2);
              ctx.fill();
            } else {
              ctx.fillRect(-p.r, -p.r * 0.5, p.r * 2, p.r);
            }
            ctx.restore();
            break;
          case 'hearts':
            ctx.globalAlpha = 0.55 + 0.35 * Math.sin(p.t);
            ctx.fillStyle = '#ff6fc1';
            ctx.font = `${Math.round(p.r * 5 + 6)}px sans-serif`;
            ctx.fillText('♥', p.x, p.y);
            break;
          case 'embers':
            ctx.globalAlpha = 0.3 + 0.7 * Math.max(0, Math.sin(p.t * 1.7));
            dot(p.x, p.y, p.r * 0.6, p.s > 1.3 ? '#9b4dff' : '#ff8a3d', true);
            break;
        }
      }

      function draw(now){
        ctx.clearRect(0, 0, W, H);
        const light = document.documentElement.dataset.theme === 'light';
        // Ultra: additive blending makes overlapping glows bloom
        ctx.globalCompositeOperation = getGraphics() === 'ultra' && !light ? 'lighter' : 'source-over';
        for (const p of particles){
          if (!reduceMotion) move(p);
          drawParticle(p, light);
        }

        // the odd shooting star at night
        if (kind === 'night' && !reduceMotion){
          if (!shooting && now > nextShootAt){
            shooting = { x: Math.random() * W * 0.7, y: Math.random() * H * 0.4, life: 0 };
          }
          if (shooting){
            shooting.life += 1;
            const len = 70;
            const sx = shooting.x + shooting.life * 9;
            const sy = shooting.y + shooting.life * 4;
            const streak = light ? '58,74,154' : '255,255,255';
            const grad = ctx.createLinearGradient(sx - len, sy - len * 0.45, sx, sy);
            grad.addColorStop(0, `rgba(${streak},0)`);
            grad.addColorStop(1, `rgba(${streak},0.9)`);
            ctx.globalAlpha = Math.max(0, 1 - shooting.life / 45);
            ctx.strokeStyle = grad;
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(sx - len, sy - len * 0.45);
            ctx.lineTo(sx, sy);
            ctx.stroke();
            if (shooting.life > 45){
              shooting = null;
              nextShootAt = now + 6000 + Math.random() * 9000;
            }
          }
        }
        ctx.globalAlpha = 1;
        ctx.globalCompositeOperation = 'source-over';
      }

      function loop(now){
        draw(now);
        raf = requestAnimationFrame(loop);
      }

      function followPointer(e){
        if (phase === 'night') return;
        const r = visor.getBoundingClientRect();
        const dx = e.clientX - (r.left + r.width / 2);
        const dy = e.clientY - (r.top + r.height / 2);
        const dist = Math.hypot(dx, dy) || 1;
        const reach = Math.min(1, dist / 220);
        eyes.forEach(eye => {
          eye.style.translate = `${(dx / dist) * 3.5 * reach}px ${(dy / dist) * 3 * reach}px`;
        });
      }

      return {
        start(){
          if (running) return;
          running = true;
          resize();
          phase = null;
          holiday = null;
          updatePhase();
          phaseTimer = setInterval(updatePhase, 60000);
          panelObserver.observe(panelEl);
          window.addEventListener('pointermove', followPointer, { passive: true });
          nextShootAt = performance.now() + 3000;
          if (reduceMotion) draw(0); else raf = requestAnimationFrame(loop);
          Pet.start();
        },
        stop(){
          if (!running) return;
          running = false;
          cancelAnimationFrame(raf);
          clearInterval(phaseTimer);
          panelObserver.disconnect();
          window.removeEventListener('pointermove', followPointer);
          ctx.clearRect(0, 0, W, H);
          delete document.documentElement.dataset.phase;
          delete document.documentElement.dataset.holiday;
          eyes.forEach(eye => { eye.style.translate = ''; });
          shooting = null;
          Pet.stop();
        },
        // High <-> Ultra changes the particle count without a restart
        refresh(){
          if (!running) return;
          makeParticles();
          if (reduceMotion) draw(0);
        }
      };
    })();

    // -----------------------------------------------------------
    // Ultra graphics: everything in High, plus a 3D parallax tilt.
    // The pointer (or tilting a phone) sets --px / --py on <html>,
    // eased toward the target every frame; CSS turns those into a
    // slight panel rotation, layers that drift at different depths
    // and a moving light sheen. Off with prefers-reduced-motion.
    // -----------------------------------------------------------
    const Ultra = (() => {
      const root = document.documentElement;
      let running = false, raf = null;
      let tx = 0, ty = 0, x = 0, y = 0;

      const clamp = (v) => Math.max(-1, Math.min(1, v));

      function onPointer(e){
        tx = clamp((e.clientX / window.innerWidth) * 2 - 1);
        ty = clamp((e.clientY / window.innerHeight) * 2 - 1);
      }

      function onTilt(e){
        if (e.gamma === null || e.beta === null) return;
        tx = clamp(e.gamma / 25);
        ty = clamp((e.beta - 45) / 25); // ~45deg is how a phone is usually held
      }

      function frame(){
        x += (tx - x) * 0.08;
        y += (ty - y) * 0.08;
        root.style.setProperty('--px', x.toFixed(3));
        root.style.setProperty('--py', y.toFixed(3));
        raf = requestAnimationFrame(frame);
      }

      return {
        start(){
          if (running || reduceMotion) return;
          running = true;
          window.addEventListener('pointermove', onPointer, { passive: true });
          window.addEventListener('deviceorientation', onTilt);
          raf = requestAnimationFrame(frame);
        },
        stop(){
          if (!running) return;
          running = false;
          cancelAnimationFrame(raf);
          window.removeEventListener('pointermove', onPointer);
          window.removeEventListener('deviceorientation', onTilt);
          tx = ty = x = y = 0;
          root.style.removeProperty('--px');
          root.style.removeProperty('--py');
        },
        // iOS only hands out tilt data after asking, from a tap
        askForTilt(){
          if (window.DeviceOrientationEvent && typeof DeviceOrientationEvent.requestPermission === 'function'){
            DeviceOrientationEvent.requestPermission().catch(() => {});
          }
        }
      };
    })();

    // -----------------------------------------------------------
    // Trophies earned just by visiting (see achievements.js)
    // -----------------------------------------------------------
    (function visitTrophies(){
      if (!window.R632Ach) return;
      R632Ach.unlock('powered_on');
      const hour = new Date().getHours();
      if (hour < 5) R632Ach.unlock('night_owl');
      else if (hour < 7) R632Ach.unlock('early_bird');
    })();

    if (getGraphics() !== 'low') HighGfx.start();
    if (getGraphics() === 'ultra') Ultra.start();

    // -----------------------------------------------------------
    // Frame-rate check for automatic High: watch a few seconds of
    // frames (skipping the first, busy one); if the device averages
    // under ~40 fps, drop to Low quietly and remember that for next
    // time. Only for an automatic pick -- a hand-picked High stays.
    // -----------------------------------------------------------
    (function autoGraphicsCheck(){
      const root = document.documentElement;
      if (root.dataset.graphicsAuto !== 'true' || getGraphics() !== 'high') return;
      const MIN_FPS = 40, SKIP_MS = 1000, SAMPLE_MS = 4000;
      let start = null, frames = 0;
      function frame(now){
        if (root.dataset.graphicsAuto !== 'true') return; // picked by hand meanwhile
        if (document.hidden){ requestAnimationFrame(frame); return; }
        if (start === null) start = now;
        const t = now - start;
        if (t >= SKIP_MS) frames++;
        if (t < SKIP_MS + SAMPLE_MS){ requestAnimationFrame(frame); return; }
        const fps = frames / (SAMPLE_MS / 1000);
        if (fps < MIN_FPS){
          try { localStorage.setItem('robot632_graphics_auto', 'low'); } catch (e){}
          root.dataset.graphics = 'low';
          renderButtons();
          HighGfx.stop();
          if (!settingsPop.hidden) syncSettings();
        }
      }
      requestAnimationFrame(frame);
    })();
  </script>
