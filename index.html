<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Robot632</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Nunito:wght@700;800&family=Bangers&family=Permanent+Marker&family=Kalam:wght@700&family=Chewy&family=Rubik:wght@700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #007a7a;
    --text: #ffffff;
    --text-shadow: rgba(0,0,0,0.18);
    --icon-front: #e4e7eb;
    --icon-side: #7a828d;
    --icon-dark: #4b525c;
    --icon-highlight: #ffffff;
    --pink: #ff6fc1;
    --blue: #2f6fed;
    --orange: #ff8a3d;
    --green: #2fb84f;
    --roblox-red: #e2242b;
  }

  *{ box-sizing: border-box; }

  body{
    margin:0;
    min-height:100vh;
    background: var(--bg);
    color: var(--text);
    font-family: 'Nunito', sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 60px 20px;
  }

  .page{
    width:100%;
    max-width: 560px;
    text-align:center;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap: 26px;
  }

  .bot-icon{
    width: 150px;
    height: 150px;
    position: relative;
    filter: drop-shadow(0 10px 14px rgba(0,0,0,0.28));
  }

  /* antenna */
  .bot-icon .antenna{
    position:absolute;
    top:-22px;
    left:41%;
    width:6px;
    height:22px;
    border-radius: 3px;
    background: linear-gradient(90deg, var(--icon-dark), var(--icon-front) 45%, var(--icon-side));
  }
  .bot-icon .antenna::after{
    content:'';
    position:absolute;
    top:-13px;
    left:50%;
    transform: translateX(-50%);
    width:14px;
    height:14px;
    border-radius:50%;
    background:
      radial-gradient(circle at 32% 28%, #ffffff, var(--icon-front) 35%, var(--icon-side) 75%, var(--icon-dark) 100%);
    box-shadow: inset -2px -3px 4px rgba(0,0,0,0.35);
  }

  /* right-hand side panel gives the head its 3D depth */
  .bot-icon .side{
    position:absolute;
    top:8px;
    right:2px;
    width: 46%;
    height: 84%;
    border-radius: 16px;
    background: linear-gradient(120deg, var(--icon-side) 0%, var(--icon-dark) 55%, #383d44 100%);
    box-shadow:
      inset 3px 0 6px rgba(0,0,0,0.35),
      inset -4px -4px 8px rgba(0,0,0,0.4),
      inset 3px 3px 5px rgba(255,255,255,0.08);
  }
  .bot-icon .side::before,
  .bot-icon .side::after{
    content:'';
    position:absolute;
    left:16%;
    width:68%;
    height:2px;
    background: rgba(0,0,0,0.35);
    box-shadow: 0 1px 0 rgba(255,255,255,0.06);
  }
  .bot-icon .side::before{ top:38%; }
  .bot-icon .side::after{ top:56%; }

  /* front face plate */
  .bot-icon .face{
    position:absolute;
    left:0;
    top:0;
    width: 66%;
    height: 96%;
    border-radius: 20px;
    background: linear-gradient(155deg, #f2f3f5 0%, var(--icon-front) 40%, #c3c8ce 80%, var(--icon-side) 100%);
    box-shadow:
      inset 0 3px 4px rgba(255,255,255,0.85),
      inset 0 -10px 14px rgba(0,0,0,0.18),
      inset -6px 0 10px rgba(0,0,0,0.08);
    display:flex;
    align-items:center;
    justify-content:center;
  }

  /* rivets for extra mechanical detail */
  .bot-icon .face::before,
  .bot-icon .face::after{
    content:'';
    position:absolute;
    width:6px;
    height:6px;
    border-radius:50%;
    background: radial-gradient(circle at 35% 30%, #fff, var(--icon-side) 70%, var(--icon-dark));
    box-shadow: 0 1px 1px rgba(0,0,0,0.3);
  }
  .bot-icon .face::before{ top:10px; left:10px; }
  .bot-icon .face::after{ bottom:10px; left:10px; }

  /* visor housing the eyes, recessed for depth */
  .bot-icon .visor{
    position:absolute;
    width: 76%;
    height: 34%;
    border-radius: 12px;
    background: linear-gradient(180deg, #2c2f34, #45494f 60%, #575c63);
    box-shadow:
      inset 0 3px 6px rgba(0,0,0,0.6),
      inset 0 -2px 2px rgba(255,255,255,0.08);
    display:flex;
    align-items:center;
    justify-content:center;
    gap: 12px;
  }
  .bot-icon .eye{
    width:14px;
    height:14px;
    border-radius:50%;
    background: radial-gradient(circle at 35% 30%, #ffffff, var(--icon-front) 45%, var(--icon-side) 85%);
    box-shadow:
      0 0 6px rgba(255,255,255,0.6),
      inset -2px -2px 3px rgba(0,0,0,0.3);
  }

  .wordmark{
    font-size: clamp(44px, 10vw, 72px);
    line-height: 1;
    margin: 0;
    color: var(--text);
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
  }
  .wordmark span{
    display: inline-block;
    cursor: pointer;
    transition: transform 0.25s ease;
    text-shadow: 0 2px 6px var(--text-shadow);
  }
  .wordmark span:active{ transform: scale(0.85) !important; }

  .tagline{
    font-weight: 800;
    font-size: 19px;
    color: var(--text);
    margin: -6px 0 0;
    max-width: 460px;
    line-height: 1.4;
    text-shadow: 0 1px 4px var(--text-shadow);
  }

  .socials{
    display:flex;
    gap: 20px;
  }
  .social-btn{
    color: #3a4048;
    display:flex;
    align-items:center;
    justify-content:center;
    transition: opacity 0.15s ease;
  }
  .social-btn:hover{ opacity: 0.7; }
  .social-btn svg{ width:26px; height:26px; }

  .pill{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    padding: 14px 34px;
    border-radius: 14px;
    color: #1a1a1a;
    font-family: 'Nunito', sans-serif;
    font-weight: 800;
    font-size: 17px;
    text-decoration:none;
    border: 4px solid transparent;
    background:
      linear-gradient(var(--pill-fill, #f4f2ee), var(--pill-fill, #f4f2ee)) padding-box,
      linear-gradient(135deg, var(--pill-color, var(--pink)), color-mix(in srgb, var(--pill-color, var(--pink)) 35%, white)) border-box;
    box-shadow: 0 3px 0 rgba(0,0,0,0.12);
    transition: transform 0.12s ease, background 0.15s ease;
  }
  .pill:hover{ transform: translateY(-2px); }

  /* add this class to any pill (including main-cta) to make its
     fill see-through, leaving just the gradient border + text */
  .pill.transparent{
    --pill-fill: transparent;
    color: var(--text);
    box-shadow: none;
  }

  .main-cta{
    --pill-color: var(--roblox-red);
    --pill-fill: linear-gradient(180deg, #ffffff, #f4f2ee 60%);
    background:
      var(--pill-fill) padding-box,
      linear-gradient(135deg, var(--roblox-red), color-mix(in srgb, var(--roblox-red) 35%, white)) border-box;
    color: #000000;
    padding: 17px 42px;
    font-size: 20px;
    border-width: 5px;
    box-shadow: 0 4px 0 rgba(0,0,0,0.2);
  }
  .main-cta.transparent{
    --pill-fill: transparent;
    color: var(--text);
    box-shadow: none;
  }

  .section-label{
    font-weight: 800;
    font-size: 18px;
    color: var(--text);
    margin: 10px 0 -8px;
  }

  .links-grid{
    display:flex;
    flex-wrap: wrap;
    gap: 16px;
    justify-content:center;
  }

</style>
</head>
<body>

  <main class="page">

    <div class="bot-icon">
      <div class="antenna"></div>
      <div class="side"></div>
      <div class="face">
        <div class="visor">
          <span class="eye"></span>
          <span class="eye"></span>
        </div>
      </div>
    </div>

    <h1 class="wordmark">
      <span>R</span><span>o</span><span>b</span><span>o</span><span>t</span><span>6</span><span>3</span><span>2</span>
    </h1>
    <p class="tagline" id="tagline">just a robot doing robot things, also i play roblox i think</p>

    <div class="socials" id="socials"></div>

    <a class="pill main-cta" href="roblox.html" id="main-cta">Roblox</a>

    <div class="links-grid" id="links-grid"></div>

  </main>

  <script>
    // -----------------------------------------------------------
    // Modular buttons: add/remove/reorder entries here and the
    // page updates itself -- no need to touch the HTML.
    //
    // Any pill (socials excluded) can be made see-through by
    // setting transparent: true -- that just adds the .transparent
    // class, which drops the fill and keeps the gradient border.
    // -----------------------------------------------------------

    const SOCIALS = [
      {
        label: 'Twitter / X',
        href: 'https://x.com/Robot632632',
        path: 'M18.9 2H22l-7.6 8.7L23.3 22h-6.9l-5.4-6.7L4.8 22H1.7l8.1-9.3L1 2h7l4.9 6.1L18.9 2Zm-1.2 18h1.9L6.4 4H4.4l13.3 16Z'
      },
      {
        label: 'GitHub',
        href: 'https://github.com/Robot632',
        path: 'M12 .5C5.7.5.7 5.6.7 12c0 5.1 3.3 9.4 7.9 11 .6.1.8-.3.8-.6v-2.2c-3.2.7-3.9-1.4-3.9-1.4-.5-1.3-1.3-1.7-1.3-1.7-1.1-.7.1-.7.1-.7 1.2.1 1.8 1.2 1.8 1.2 1 1.8 2.8 1.3 3.4 1 .1-.8.4-1.3.8-1.6-2.6-.3-5.3-1.3-5.3-5.7 0-1.3.4-2.3 1.2-3.1-.1-.3-.5-1.5.1-3.1 0 0 1-.3 3.3 1.2 1-.3 2-.4 3-.4s2 .1 3 .4c2.3-1.5 3.3-1.2 3.3-1.2.6 1.6.2 2.8.1 3.1.7.8 1.2 1.9 1.2 3.1 0 4.4-2.7 5.4-5.3 5.7.4.4.8 1.1.8 2.2v3.3c0 .3.2.7.8.6 4.6-1.6 7.9-5.9 7.9-11C23.3 5.6 18.3.5 12 .5Z'
      }
      // add more socials here, e.g.:
      // { label: 'Discord', href: 'https://discord.gg/...', path: '...' }
    ];

    const LINKS = [
      { label: 'Roblox',   href: 'roblox.html', color: 'var(--blue)' },
      { label: 'About',    href: '#', color: 'var(--orange)' },
      { label: 'Friends',  href: '#', color: 'var(--green)', transparent: true }
      // add more links here, e.g.:
      // { label: 'Shop', href: '#', color: 'var(--pink)', transparent: true }
    ];

    const MAIN_CTA = { transparent: false };

    function renderSocials(){
      const container = document.getElementById('socials');
      container.innerHTML = SOCIALS.map(s => `
        <a class="social-btn" href="${s.href}" aria-label="${s.label}">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="${s.path}"/></svg>
        </a>
      `).join('');
    }

    function renderLinks(){
      const container = document.getElementById('links-grid');
      container.innerHTML = LINKS.map(l => `
        <a class="pill${l.transparent ? ' transparent' : ''}" style="--pill-color:${l.color}" href="${l.href}">${l.label}</a>
      `).join('');
    }

    function applyMainCta(){
      const el = document.getElementById('main-cta');
      el.classList.toggle('transparent', !!MAIN_CTA.transparent);
    }

    renderSocials();
    renderLinks();
    applyMainCta();

    // -----------------------------------------------------------
    // Fonts: a shared "font position" advances by one step every
    // cycle, and the whole title updates letter-by-letter in a
    // quick cascade (not all at once) before pausing.
    //
    // Clicking a letter bumps that letter's own offset forward by
    // one step, so it stays permanently that many fonts ahead of
    // the rest of the group on every future cascade -- it doesn't
    // resync with everyone else.
    // -----------------------------------------------------------
    const FONTS = [
      { family: "'Rubik', sans-serif",         weight: 700, tilt: 0  },
      { family: "'Caveat', cursive",           weight: 700, tilt: -4 },
      { family: "'Bangers', cursive",          weight: 400, tilt: 3  },
      { family: "'Permanent Marker', cursive", weight: 400, tilt: -2 },
      { family: "'Kalam', cursive",            weight: 700, tilt: 5  },
      { family: "'Chewy', cursive",            weight: 400, tilt: -3 },
      { family: "'Nunito', sans-serif",        weight: 800, tilt: 2  }
    ];

    const letters = Array.from(document.querySelectorAll('.wordmark span'));
    const letterOffsets = letters.map(() => 0);
    let fontIndex = 0;

    function applyFont(letter, i){
      const font = FONTS[(fontIndex + letterOffsets[i]) % FONTS.length];
      letter.style.fontFamily = font.family;
      letter.style.fontWeight = font.weight;
      letter.style.transform = `rotate(${font.tilt}deg)`;
    }

    function cascadeFonts(){
      fontIndex = (fontIndex + 1) % FONTS.length;
      let i = 0;

      function nextLetter(){
        if (i < letters.length){
          applyFont(letters[i], i);
          i++;
          setTimeout(nextLetter, 40); // 40ms stagger between letters
        } else {
          setTimeout(cascadeFonts, 2000); // pause before the next cascade
        }
      }
      nextLetter();
    }

    // Quick shrink then a springy ease-out back to full size
    function bounceLetter(letter){
      letter.animate(
        [
          { transform: `${letter.style.transform} scale(1)`, offset: 0 },
          { transform: `${letter.style.transform} scale(0.75)`, offset: 0.08 },
          { transform: `${letter.style.transform} scale(1)`, offset: 1 }
        ],
        { duration: 500, easing: 'cubic-bezier(0.16, 1, 0.3, 1)', fill: 'none' }
      );
    }

    letters.forEach((letter, i) => {
      letter.addEventListener('click', () => {
        letterOffsets[i] = (letterOffsets[i] + 1) % FONTS.length;
        applyFont(letter, i);
        bounceLetter(letter);
      });
    });

    document.fonts.ready.then(() => {
      letters.forEach((letter, i) => applyFont(letter, i)); // uniform on first load
      cascadeFonts();
    });

    // -----------------------------------------------------------
    // Tagline: pick a new line from the list every visit, cycling
    // through the whole array before any line repeats.
    // -----------------------------------------------------------
    const TAGLINES = [
      "just a robot doing robot things, also i play roblox i think",
      "beep boop, currently loading personality...",
      "99% battery, 100% vibes",
      "not a bot, just built like one",
      "probably somewhere on roblox right now",
      "made of metal, powered by snacks",
      "error 404: normal robot not found",
      "still figuring out what buttons do what"
    ];

    (function rotateTagline(){
      const STORAGE_KEY = 'robot632_tagline_index';
      let index = parseInt(localStorage.getItem(STORAGE_KEY), 10);
      if (isNaN(index)) index = -1;
      index = (index + 1) % TAGLINES.length;
      localStorage.setItem(STORAGE_KEY, index);

      const el = document.getElementById('tagline');
      if (el) el.textContent = TAGLINES[index];
    })();
  </script>

</body>
</html>
