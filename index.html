<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Robot632</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Nunito:wght@700;800&family=Bangers&family=Permanent+Marker&family=Kalam:wght@700&family=Chewy&family=Rubik:wght@700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #007a7a;
    --bg-deep: #005f5f;
    --text: #ffffff;
    --text-shadow: rgba(0,0,0,0.18);
    --icon-front: #e4e7eb;
    --icon-side: #7a828d;
    --icon-dark: #4b525c;
    --icon-highlight: #ffffff;
    --pink: #ff6fc1;
    --blue: #2f6fed;
    --orange: #ff8a3d;
    --green: #2fb84f;
    --roblox-red: #e2242b;
    --panel-line: rgba(255,255,255,0.14);
    --bolt: rgba(255,255,255,0.55);

    /* uniform button geometry -- every button on the page reads this */
    --btn-w: 226px;
    --btn-h: 56px;
  }

  *{ box-sizing: border-box; }

  body{
    margin:0;
    height:100vh;
    height:100dvh;
    width:100vw;
    overflow:hidden;
    background:
      radial-gradient(circle at 50% -10%, var(--bg-deep), var(--bg) 55%);
    color: var(--text);
    font-family: 'Nunito', sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 14px;
  }

  /* faint HUD scanline grid behind everything, ties the page to the
     "robot control panel" idea without competing with content */
  body::before{
    content:'';
    position:fixed;
    inset:0;
    pointer-events:none;
    background-image:
      linear-gradient(var(--panel-line) 1px, transparent 1px),
      linear-gradient(90deg, var(--panel-line) 1px, transparent 1px);
    background-size: 34px 34px;
    opacity: 0.15;
  }

  .panel{
    position:relative;
    width:100%;
    height:100%;
    background: rgba(0,0,0,0.14);
    border: 2px solid rgba(255,255,255,0.18);
    border-radius: 24px;
    padding: clamp(28px, 6vh, 46px) clamp(18px, 6vw, 34px);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap: clamp(16px, 3.5vh, 26px);
    overflow:auto;
    box-shadow: 0 30px 60px rgba(0,0,0,0.25);
  }

  /* corner bolts -- echoes the rivets on the bot's face, gives the
     whole panel the feel of a maintenance hatch rather than a card */
  .bolt{
    position:absolute;
    width:9px;
    height:9px;
    border-radius:50%;
    background: radial-gradient(circle at 35% 30%, #fff, var(--bolt) 60%, rgba(0,0,0,0.3));
    box-shadow: 0 1px 2px rgba(0,0,0,0.35);
  }
  .bolt.tl{ top:16px; left:18px; }
  .bolt.tr{ top:16px; right:18px; }
  .bolt.bl{ bottom:16px; left:18px; }
  .bolt.br{ bottom:16px; right:18px; }

  .socials{
    position:absolute;
    top: clamp(14px, 3vh, 18px);
    right: clamp(46px, 10vw, 60px);
    display:flex;
    gap: 14px;
  }
  .social-btn{
    color: rgba(255,255,255,0.85);
    display:flex;
    align-items:center;
    justify-content:center;
    transition: opacity 0.15s ease, transform 0.15s ease;
  }
  .social-btn:hover{ opacity: 0.7; transform: translateY(-1px); }
  .social-btn svg{ width:auto; height:20px; }

  .title-row{
    display:flex;
    align-items:center;
    justify-content:center;
    flex-wrap: wrap;
    gap: 18px;
  }

  .bot-icon{
    width: 96px;
    height: 96px;
    position: relative;
    filter: drop-shadow(0 10px 14px rgba(0,0,0,0.28));
    flex-shrink: 0;
  }

  .bot-icon .antenna{
    position:absolute;
    top:-17px;
    left:41%;
    width:5px;
    height:17px;
    border-radius: 2px;
    background: linear-gradient(90deg, var(--icon-dark), var(--icon-front) 45%, var(--icon-side));
  }
  .bot-icon .antenna::after{
    content:'';
    position:absolute;
    top:-10px;
    left:50%;
    transform: translateX(-50%);
    width:11px;
    height:11px;
    border-radius:50%;
    background:
      radial-gradient(circle at 32% 28%, #ffffff, var(--icon-front) 35%, var(--icon-side) 75%, var(--icon-dark) 100%);
    box-shadow: inset -2px -3px 4px rgba(0,0,0,0.35);
  }

  .bot-icon .side{
    position:absolute;
    top:6px;
    right:2px;
    width: 46%;
    height: 84%;
    border-radius: 12px;
    background: linear-gradient(120deg, var(--icon-side) 0%, var(--icon-dark) 55%, #383d44 100%);
    box-shadow:
      inset 3px 0 6px rgba(0,0,0,0.35),
      inset -4px -4px 8px rgba(0,0,0,0.4),
      inset 3px 3px 5px rgba(255,255,255,0.08);
  }
  .bot-icon .side::before,
  .bot-icon .side::after{
    content:'';
    position:absolute;
    left:16%;
    width:68%;
    height:2px;
    background: rgba(0,0,0,0.35);
    box-shadow: 0 1px 0 rgba(255,255,255,0.06);
  }
  .bot-icon .side::before{ top:38%; }
  .bot-icon .side::after{ top:56%; }

  .bot-icon .face{
    position:absolute;
    left:0;
    top:0;
    width: 66%;
    height: 96%;
    border-radius: 15px;
    background: linear-gradient(155deg, #f2f3f5 0%, var(--icon-front) 40%, #c3c8ce 80%, var(--icon-side) 100%);
    box-shadow:
      inset 0 3px 4px rgba(255,255,255,0.85),
      inset 0 -10px 14px rgba(0,0,0,0.18),
      inset -6px 0 10px rgba(0,0,0,0.08);
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .bot-icon .face::before,
  .bot-icon .face::after{
    content:'';
    position:absolute;
    width:5px;
    height:5px;
    border-radius:50%;
    background: radial-gradient(circle at 35% 30%, #fff, var(--icon-side) 70%, var(--icon-dark));
    box-shadow: 0 1px 1px rgba(0,0,0,0.3);
  }
  .bot-icon .face::before{ top:8px; left:8px; }
  .bot-icon .face::after{ bottom:8px; left:8px; }

  .bot-icon .visor{
    position:absolute;
    width: 76%;
    height: 34%;
    border-radius: 9px;
    background: linear-gradient(180deg, #2c2f34, #45494f 60%, #575c63);
    box-shadow:
      inset 0 3px 6px rgba(0,0,0,0.6),
      inset 0 -2px 2px rgba(255,255,255,0.08);
    display:flex;
    align-items:center;
    justify-content:center;
    gap: 9px;
  }
  .bot-icon .eye{
    width:11px;
    height:11px;
    border-radius:50%;
    background: radial-gradient(circle at 35% 30%, #ffffff, var(--icon-front) 45%, var(--icon-side) 85%);
    box-shadow:
      0 0 6px rgba(255,255,255,0.6),
      inset -2px -2px 3px rgba(0,0,0,0.3);
  }

  .wordmark{
    font-size: clamp(32px, 8vw, 56px);
    line-height: 1;
    margin: 0;
    color: var(--text);
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
  }
  .wordmark span{
    display: inline-block;
    cursor: pointer;
    transition: transform 0.25s ease;
    text-shadow: 0 2px 6px var(--text-shadow);
  }
  .wordmark span:active{ transform: scale(0.85) !important; }

  .tagline{
    font-weight: 800;
    font-size: 16px;
    color: rgba(255,255,255,0.92);
    margin: -8px 0 0;
    max-width: 400px;
    line-height: 1.4;
    text-shadow: 0 1px 4px var(--text-shadow);
    padding: 10px 16px;
    border-radius: 12px;
    background: rgba(0,0,0,0.16);
    border: 1px solid var(--panel-line);
  }

  /* -----------------------------------------------------------
     Buttons: a "physical panel button" look instead of a flat
     outlined pill -- glossy top, deeper base color, pressed state
     on click. Every button reads the same fixed --btn-w / --btn-h
     so nothing gains weight just by being first in the list.
  ------------------------------------------------------------ */
  .buttons{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap: 14px;
  }

  .btn{
    width: var(--btn-w);
    height: var(--btn-h);
    display:inline-flex;
    align-items:center;
    justify-content:center;
    border-radius: 16px;
    color: #ffffff;
    font-family: 'Nunito', sans-serif;
    font-weight: 800;
    font-size: 17px;
    letter-spacing: 0.01em;
    text-decoration:none;
    text-shadow: 0 1px 3px rgba(0,0,0,0.3);
    background: linear-gradient(180deg,
      color-mix(in srgb, var(--btn-color, var(--pink)) 75%, white) 0%,
      var(--btn-color, var(--pink)) 45%,
      color-mix(in srgb, var(--btn-color, var(--pink)) 80%, black) 100%);
    box-shadow:
      inset 0 2px 0 rgba(255,255,255,0.55),
      inset 0 -4px 8px rgba(0,0,0,0.28),
      0 8px 16px rgba(0,0,0,0.28);
    transition: transform 0.12s ease, box-shadow 0.12s ease;
  }
  .btn:hover{ transform: translateY(-2px); }
  .btn:active{
    transform: translateY(1px);
    box-shadow:
      inset 0 3px 6px rgba(0,0,0,0.35),
      0 3px 8px rgba(0,0,0,0.22);
  }

</style>
</head>
<body>

  <main class="panel">
    <span class="bolt tl"></span>
    <span class="bolt tr"></span>
    <span class="bolt bl"></span>
    <span class="bolt br"></span>

    <div class="socials" id="socials"></div>

    <div class="title-row">
      <div class="bot-icon">
        <div class="antenna"></div>
        <div class="side"></div>
        <div class="face">
          <div class="visor">
            <span class="eye"></span>
            <span class="eye"></span>
          </div>
        </div>
      </div>

      <h1 class="wordmark">
        <span>R</span><span>o</span><span>b</span><span>o</span><span>t</span><span>6</span><span>3</span><span>2</span>
      </h1>
    </div>
    <p class="tagline" id="tagline">just a robot doing robot things, also i play roblox i think</p>

    <div class="buttons" id="buttons"></div>
  </main>

  <script>
    // -----------------------------------------------------------
    // Modular buttons: everything on the page is one entry in
    // BUTTONS. To add a button, add an entry. To hide one without
    // deleting it, set visible: false -- it stays in the list for
    // later, it just won't render. All buttons share one fixed
    // size (--btn-w / --btn-h in CSS) no matter how many are shown.
    // -----------------------------------------------------------

    // Same modular pattern as BUTTONS: add/remove/reorder here, and
    // set visible: false to hide one without deleting its entry.
    const SOCIALS = [
      {
        label: 'Youtube',
        href: 'https://www.youtube.com/@Robot632',
        path: 'M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z',
        visible: true
      },
      {
        label: 'GitHub',
        href: 'https://github.com/Robot632',
        path: 'M12 .5C5.7.5.7 5.6.7 12c0 5.1 3.3 9.4 7.9 11 .6.1.8-.3.8-.6v-2.2c-3.2.7-3.9-1.4-3.9-1.4-.5-1.3-1.3-1.7-1.3-1.7-1.1-.7.1-.7.1-.7 1.2.1 1.8 1.2 1.8 1.2 1 1.8 2.8 1.3 3.4 1 .1-.8.4-1.3.8-1.6-2.6-.3-5.3-1.3-5.3-5.7 0-1.3.4-2.3 1.2-3.1-.1-.3-.5-1.5.1-3.1 0 0 1-.3 3.3 1.2 1-.3 2-.4 3-.4s2 .1 3 .4c2.3-1.5 3.3-1.2 3.3-1.2.6 1.6.2 2.8.1 3.1.7.8 1.2 1.9 1.2 3.1 0 4.4-2.7 5.4-5.3 5.7.4.4.8 1.1.8 2.2v3.3c0 .3.2.7.8.6 4.6-1.6 7.9-5.9 7.9-11C23.3 5.6 18.3.5 12 .5Z',
        visible: true
      }
    ];

    const BUTTONS = [
      { label: 'Roblox',  href: 'roblox.html', color: 'var(--roblox-red)', visible: true  },
      { label: 'About',   href: '#',           color: 'var(--orange)',     visible: false },
      { label: 'Friends', href: '#',           color: 'var(--green)',      visible: false }
    ];

    function renderSocials(){
      const container = document.getElementById('socials');
      container.innerHTML = SOCIALS
        .filter(s => s.visible !== false)
        .map(s => `
          <a class="social-btn" href="${s.href}" aria-label="${s.label}">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="${s.path}"/></svg>
          </a>
        `).join('');
    }

    function renderButtons(){
      const container = document.getElementById('buttons');
      container.innerHTML = BUTTONS
        .filter(b => b.visible !== false)
        .map(b => `
          <a class="btn" style="--btn-color:${b.color}" href="${b.href}">${b.label}</a>
        `).join('');
    }

    renderSocials();
    renderButtons();

    // -----------------------------------------------------------
    // Fonts: a shared "font position" advances by one step every
    // cycle, and the whole title updates letter-by-letter in a
    // quick cascade (not all at once) before pausing.
    //
    // Clicking a letter bumps that letter's own offset forward by
    // one step, so it stays permanently that many fonts ahead of
    // the rest of the group on every future cascade -- it doesn't
    // resync with everyone else.
    // -----------------------------------------------------------
    const FONTS = [
      { family: "'Rubik', sans-serif",         weight: 700, tilt: 0  },
      { family: "'Caveat', cursive",           weight: 700, tilt: -4 },
      { family: "'Bangers', cursive",          weight: 400, tilt: 3  },
      { family: "'Permanent Marker', cursive", weight: 400, tilt: -2 },
      { family: "'Kalam', cursive",            weight: 700, tilt: 5  },
      { family: "'Chewy', cursive",            weight: 400, tilt: -3 },
      { family: "'Nunito', sans-serif",        weight: 800, tilt: 2  }
    ];

    const letters = Array.from(document.querySelectorAll('.wordmark span'));
    const letterOffsets = letters.map(() => 0);
    let fontIndex = 0;

    function applyFont(letter, i){
      const font = FONTS[(fontIndex + letterOffsets[i]) % FONTS.length];
      letter.style.fontFamily = font.family;
      letter.style.fontWeight = font.weight;
      letter.style.transform = `rotate(${font.tilt}deg)`;
    }

    function cascadeFonts(){
      fontIndex = (fontIndex + 1) % FONTS.length;
      let i = 0;

      function nextLetter(){
        if (i < letters.length){
          applyFont(letters[i], i);
          i++;
          setTimeout(nextLetter, 40); // 40ms stagger between letters
        } else {
          setTimeout(cascadeFonts, 2000); // pause before the next cascade
        }
      }
      nextLetter();
    }

    // Quick shrink then a springy ease-out back to full size
    function bounceLetter(letter){
      letter.animate(
        [
          { transform: `${letter.style.transform} scale(1)`, offset: 0 },
          { transform: `${letter.style.transform} scale(0.75)`, offset: 0.08 },
          { transform: `${letter.style.transform} scale(1)`, offset: 1 }
        ],
        { duration: 500, easing: 'cubic-bezier(0.16, 1, 0.3, 1)', fill: 'none' }
      );
    }

    letters.forEach((letter, i) => {
      letter.addEventListener('click', () => {
        letterOffsets[i] = (letterOffsets[i] + 1) % FONTS.length;
        applyFont(letter, i);
        bounceLetter(letter);
      });
    });

    document.fonts.ready.then(() => {
      letters.forEach((letter, i) => applyFont(letter, i)); // uniform on first load
      cascadeFonts();
    });

    // -----------------------------------------------------------
    // Tagline: pick a new line from the list every visit, cycling
    // through the whole array before any line repeats.
    // -----------------------------------------------------------
    const TAGLINES = [
      "beep boop, currently loading personality...",
      "99% battery, 100% vibes",
      "not a bot, just built like one",
      "made of metal, powered by snacks",
      "error 404: normal robot not found",
      "still figuring out what buttons do what"
    ];

    (function rotateTagline(){
      const STORAGE_KEY = 'robot632_tagline_index';
      let index = parseInt(localStorage.getItem(STORAGE_KEY), 10);
      if (isNaN(index)) index = -1;
      index = (index + 1) % TAGLINES.length;
      localStorage.setItem(STORAGE_KEY, index);

      const el = document.getElementById('tagline');
      if (el) el.textContent = TAGLINES[index];
    })();
  </script>

</body>
</html>
